<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>野兽素材库</title>
<script src="static/marked.min.js"></script>
<script>window.API_BASE = '/web/lightapi/beastlib';</script>
<style>
:root { --primary:#007aff; --bg:#f2f2f7; --card:#fff; --text:#1c1c1e; --muted:#8e8e93; --border:#e5e5ea; --badge:#eef2ff; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#1c1c1e; --card:#2c2c2e; --text:#f2f2f7; --muted:#98989d; --border:#38383a; --badge:#2c3a5e; }
}
* { box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif; margin:0; padding:14px; background:var(--bg); color:var(--text); }
.container { max-width:760px; margin:0 auto; }
h1 { font-size:22px; margin:4px 0 6px; }
.stats { color:var(--muted); font-size:13px; margin-bottom:12px; }
#authBanner { display:none; margin-bottom:12px; padding:10px 14px; border-radius:8px; border:1px solid #f5c2c0; background:#feebeb; color:#c81e1e; font-size:14px; }
#authBanner a { color:#c81e1e; font-weight:700; }
.search { display:flex; gap:8px; margin-bottom:12px; }
.search input { flex:1; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:15px; background:var(--card); color:var(--text); outline:none; }
.search button { padding:10px 16px; border:none; border-radius:8px; background:var(--primary); color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
.search button.ghost { background:var(--card); color:var(--text); border:1px solid var(--border); }
.toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; color:var(--muted); font-size:13px; }
.toolbar select { padding:6px 8px; border:1px solid var(--border); border-radius:6px; background:var(--card); color:var(--text); font-size:13px; }
.row { background:var(--card); border-radius:12px; padding:14px 16px; margin-bottom:10px; box-shadow:0 2px 4px rgba(0,0,0,.04); cursor:pointer; }
.row .seq { color:var(--primary); font-weight:700; font-size:13px; }
.row .t { font-size:16px; font-weight:600; margin:2px 0; }
.row .kw { color:var(--muted); font-size:13px; }
.row .links { font-size:13px; margin-top:6px; }
.row .links a { color:var(--primary); text-decoration:none; }
.badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:20px; background:var(--badge); color:var(--primary); margin-right:6px; }
.badge.matched { background:#e5f4e7; color:#1e7d32; }
.badge.unmatched { background:#f5f5f5; color:#888; }
.pager { display:flex; justify-content:center; align-items:center; gap:12px; margin:16px 0; }
.pager button { padding:8px 16px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); font-size:14px; cursor:pointer; }
.pager button:disabled { opacity:.4; cursor:default; }
#detail { display:none; }
#detail h2 { font-size:20px; margin:6px 0; }
#detail .meta { color:var(--muted); font-size:13px; margin-bottom:10px; }
#detail .meta a { color:var(--primary); text-decoration:none; }
.md { line-height:1.7; font-size:15px; }
.md h1,.md h2,.md h3 { margin:14px 0 6px; }
.md p { margin:8px 0; }
.md ul,.md ol { padding-left:22px; }
.md pre { background:var(--bg); padding:10px; border-radius:8px; overflow-x:auto; }
details { background:var(--card); border-radius:12px; padding:12px 16px; margin:12px 0; }
summary { font-weight:600; cursor:pointer; }
pre.txt { white-space:pre-wrap; word-break:break-word; font-size:14px; line-height:1.7; margin:8px 0 0; }
.back { margin-bottom:10px; padding:8px 14px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--text); font-size:14px; cursor:pointer; }
.empty { text-align:center; color:var(--muted); padding:30px 0; }
</style>
</head>
<body>
<div class="container">
  <h1>野兽素材库</h1>
  <div id="authBanner">未登录，无法读取云端数据，<a href="/login">去登录</a></div>
  <div class="stats" id="stats">加载中…</div>
  <div id="listView">
    <div class="search">
      <input id="q" placeholder="搜索中文名 / 原名 / 关键词 / 正文 / 原文" autocomplete="off">
      <button id="searchBtn">搜索</button>
      <button class="ghost" id="clearBtn">清除</button>
    </div>
    <div class="toolbar">
      <span id="count"></span>
      <select id="sort">
        <option value="seq">按序号 ↑</option>
        <option value="-seq">按序号 ↓</option>
      </select>
    </div>
    <div id="list"></div>
    <div class="pager">
      <button id="prevBtn">上一页</button>
      <span id="pageInfo"></span>
      <button id="nextBtn">下一页</button>
    </div>
  </div>
  <div id="detail"></div>
</div>
<script>
(function () {
  var API = window.API_BASE;
  var LIST_FIELDS = "id,orig_id,seq,source_bv,video_id,title_zh,title_original,keywords,match_tier,yt_title,yt_view_count,yt_duration_sec,has_txt,published_at";
  var PER_PAGE = 30;
  var state = { q: "", sort: "seq", page: 1, totalPages: 1, totalItems: 0 };
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function isLoginRedirect(res) { return res && res.url && res.url.indexOf("/login") !== -1; }
  function showAuth() { document.getElementById("authBanner").style.display = "block"; }
  function escFilter(s) { return String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"'); }
  function fmtDur(sec) {
    sec = parseInt(sec, 10);
    if (!sec) return "";
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function fmtViews(v) {
    var n = parseInt(String(v || "").replace(/[^0-9]/g, ""), 10);
    if (!n) return "";
    if (n >= 100000000) return (n / 100000000).toFixed(1) + "亿次";
    if (n >= 10000) return (n / 10000).toFixed(1) + "万次";
    return n + "次";
  }
  function buildFilter() {
    if (!state.q) return "";
    var q = escFilter(state.q);
    return '(title_zh ~ "' + q + '" || title_original ~ "' + q + '" || keywords ~ "' + q + '" || md_body ~ "' + q + '" || txt_text ~ "' + q + '")';
  }
  function loadStats() {
    var jobs = [
      fetch(API + "/records/beast_records?perPage=1").then(function (r) { return r.json(); }).then(function (d) { return d.totalItems || 0; }),
      fetch(API + "/records/beast_records?perPage=1&filter=" + encodeURIComponent("has_txt=1")).then(function (r) { return r.json(); }).then(function (d) { return d.totalItems || 0; }),
      fetch(API + "/records/beast_records?perPage=1&filter=" + encodeURIComponent('match_tier="matched"')).then(function (r) { return r.json(); }).then(function (d) { return d.totalItems || 0; })
    ];
    Promise.all(jobs).then(function (vals) {
      document.getElementById("stats").textContent = "共 " + vals[0] + " 条 · 有原文 " + vals[1] + " 条 · YouTube 已匹配 " + vals[2] + " 条";
    }).catch(function () {
      document.getElementById("stats").textContent = "";
    });
  }
  function loadList() {
    var params = "perPage=" + PER_PAGE + "&page=" + state.page + "&sort=" + encodeURIComponent(state.sort) + "&fields=" + encodeURIComponent(LIST_FIELDS);
    var f = buildFilter();
    if (f) params += "&filter=" + encodeURIComponent(f);
    fetch(API + "/records/beast_records?" + params).then(function (res) {
      if (isLoginRedirect(res)) { showAuth(); throw new Error("未登录"); }
      return res.json();
    }).then(function (d) {
      state.totalItems = d.totalItems || 0;
      state.totalPages = d.totalPages || 1;
      document.getElementById("count").textContent = state.q ? ("搜索「" + state.q + "」命中 " + state.totalItems + " 条") : ("共 " + state.totalItems + " 条");
      document.getElementById("pageInfo").textContent = "第 " + state.page + " / " + state.totalPages + " 页";
      document.getElementById("prevBtn").disabled = state.page <= 1;
      document.getElementById("nextBtn").disabled = state.page >= state.totalPages;
      var html = "";
      (d.items || []).forEach(function (r) {
        var excerpt = (r.keywords || r.title_original || "").trim();
        if (excerpt.length > 60) excerpt = excerpt.slice(0, 60) + "…";
        var links = "";
        if (r.video_id) links += '<a href="https://www.youtube.com/watch?v=' + esc(r.video_id) + '" target="_blank" rel="noopener">YouTube ↗</a> · ';
        if (r.source_bv) links += '<a href="https://www.bilibili.com/video/' + esc(r.source_bv) + '" target="_blank" rel="noopener">Bilibili ↗</a>';
        var views = fmtViews(r.yt_view_count);
        if (views) links += " · " + views;
        var dur = fmtDur(r.yt_duration_sec);
        if (dur) links += " · " + dur;
        var badge = r.match_tier === "matched"
          ? '<span class="badge matched">已匹配</span>'
          : '<span class="badge unmatched">未匹配</span>';
        html += '<div class="row" data-id="' + esc(r.id) + '">'
          + '<div><span class="seq">#' + String(r.seq).padStart(3, "0") + "</span> " + badge + "</div>"
          + '<div class="t">' + esc(r.title_zh) + "</div>"
          + (excerpt ? '<div class="kw">' + esc(excerpt) + "</div>" : "")
          + '<div class="links">' + links + "</div>"
          + "</div>";
      });
      if (!html) html = '<div class="empty">没有命中。</div>';
      document.getElementById("list").innerHTML = html;
      document.querySelectorAll("#list .row").forEach(function (el) {
        el.addEventListener("click", function () { showDetail(el.getAttribute("data-id")); });
      });
    }).catch(function (e) {
      if (String(e && e.message) !== "未登录") document.getElementById("list").innerHTML = '<div class="empty">加载失败，请刷新重试。</div>';
    });
  }
  function showDetail(id) {
    fetch(API + "/records/beast_records/" + encodeURIComponent(id)).then(function (res) {
      if (isLoginRedirect(res)) { showAuth(); throw new Error("未登录"); }
      return res.json();
    }).then(function (r) {
      var links = "";
      if (r.video_id) links += '<a href="https://www.youtube.com/watch?v=' + esc(r.video_id) + '" target="_blank" rel="noopener">YouTube ↗</a> · ';
      if (r.source_bv) links += '<a href="https://www.bilibili.com/video/' + esc(r.source_bv) + '" target="_blank" rel="noopener">Bilibili ↗</a>';
      var views = fmtViews(r.yt_view_count);
      if (views) links += " · 播放 " + views;
      var dur = fmtDur(r.yt_duration_sec);
      if (dur) links += " · 时长 " + dur;
      var md = "";
      try { md = window.marked ? window.marked.parse(r.md_body || "") : esc(r.md_body || ""); } catch (e) { md = esc(r.md_body || ""); }
      var html = '<button class="back" id="backBtn">← 返回列表</button>'
        + "<h2>#" + String(r.seq).padStart(3, "0") + " " + esc(r.title_zh) + "</h2>"
        + '<div class="meta">' + (r.title_original ? esc(r.title_original) + " · " : "") + esc(r.match_tier || "") + " · " + links + "</div>"
        + (r.keywords ? '<div class="meta">关键词：' + esc(r.keywords) + "</div>" : "")
        + '<div class="md">' + md + "</div>"
        + (r.txt_text ? '<details><summary>英文原文 transcript</summary><pre class="txt">' + esc(r.txt_text) + "</pre></details>" : "")
        + (r.yt_srt_text ? '<details><summary>YouTube 字幕原文</summary><pre class="txt">' + esc(r.yt_srt_text) + "</pre></details>" : "");
      document.getElementById("listView").style.display = "none";
      var det = document.getElementById("detail");
      det.style.display = "block";
      det.innerHTML = html;
      document.getElementById("backBtn").addEventListener("click", function () {
        det.style.display = "none";
        document.getElementById("listView").style.display = "block";
      });
      window.scrollTo(0, 0);
    }).catch(function () {});
  }
  document.getElementById("searchBtn").addEventListener("click", function () {
    state.q = document.getElementById("q").value.trim();
    state.page = 1;
    loadList();
  });
  document.getElementById("q").addEventListener("keydown", function (e) {
    if (e.key === "Enter") { state.q = e.target.value.trim(); state.page = 1; loadList(); }
  });
  document.getElementById("clearBtn").addEventListener("click", function () {
    document.getElementById("q").value = "";
    state.q = ""; state.page = 1; loadList();
  });
  document.getElementById("sort").addEventListener("change", function (e) {
    state.sort = e.target.value; state.page = 1; loadList();
  });
  document.getElementById("prevBtn").addEventListener("click", function () {
    if (state.page > 1) { state.page--; loadList(); }
  });
  document.getElementById("nextBtn").addEventListener("click", function () {
    if (state.page < state.totalPages) { state.page++; loadList(); }
  });
  loadStats();
  loadList();
})();
</script>
</body>
</html>
