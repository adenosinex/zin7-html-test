<script>
(function(){
  var BLOB = JSON.parse(document.getElementById('zgblob').textContent);
  var LSKEY = 'zin7_gate_key_v1__p1783040627';
  var err = document.getElementById('err');
  var openbtn = document.getElementById('openbtn');
  var pwbtn = document.getElementById('pwbtn');
  var pwzone = document.getElementById('pwzone');
  var forget = document.getElementById('forget');
  function b64dec(s){ var bin = atob(s); var u = new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
  function b64enc(u){ var s=''; for (var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }
  function render(buf){
    var text = new TextDecoder('utf-8').decode(buf);
    document.open(); document.write(text); document.close();
  }
  function tryDecrypt(key){
    return crypto.subtle.decrypt({name:'AES-GCM', iv: b64dec(BLOB.iv)}, key, b64dec(BLOB.ct));
  }
  function hasStored(){ try { return !!localStorage.getItem(LSKEY); } catch(e){ return false; } }
  function refresh(){
    var st = hasStored();
    openbtn.hidden = !st; forget.hidden = !st;
  }
  openbtn.addEventListener('click', function(){
    err.textContent = '';
    var raw = b64dec(localStorage.getItem(LSKEY));
    crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, false, ['decrypt']).then(function(key){
      return tryDecrypt(key);
    }).then(render).catch(function(){
      try { localStorage.removeItem(LSKEY); } catch(e){}
      refresh();
      err.textContent = '本机密钥已失效，请重新输入口令';
      pwzone.hidden = false;
    });
  });
  pwbtn.addEventListener('click', function(){
    pwzone.hidden = false;
    document.getElementById('typed').focus();
  });
  document.getElementById('pwform').addEventListener('submit', function(ev){
    ev.preventDefault();
    err.textContent = '输入词后，再点中正确的按钮词';
  });
  document.getElementById('hint').textContent = BLOB.hint;
  var btns = document.getElementById('btns');
  function unlock(label){
    err.textContent = '';
    var typed = document.getElementById('typed').value.replace(/^\s+|\s+$/g, '');
    if (!typed) { err.textContent = '先输入提示词对应的词'; return; }
    var pw = BLOB.hint + ' ' + typed + ' ' + label;
    var enc = new TextEncoder();
    crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']).then(function(base){
      return crypto.subtle.deriveKey(
        {name:'PBKDF2', salt: b64dec(BLOB.salt), iterations: BLOB.iter, hash:'SHA-256'},
        base, {name:'AES-GCM', length:256}, true, ['decrypt']);
    }).then(function(key){
      return tryDecrypt(key).then(function(buf){
        return crypto.subtle.exportKey('raw', key).then(function(raw){
          try { localStorage.setItem(LSKEY, b64enc(new Uint8Array(raw))); } catch(e){}
          render(buf);
        });
      });
    }).catch(function(){
      err.textContent = '口令不对，再试一次';
    });
  }
  (BLOB.buttons || []).forEach(function(label){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.addEventListener('click', function(){ unlock(label); });
    btns.appendChild(b);
  });
  refresh();
})();
</script>
