<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>按用途选平台 — 社交·社区·资讯深度指南</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Sans+SC:wght@300;400;500;700&family=DM+Mono:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#06060a;--bg2:#0a0a10;
  --s1:#101018;--s2:#161622;--s3:#1e1e30;
  --gold:#d4a843;--gold-b:#ecc050;--gold-d:#7a6430;
  --txt:#e6e2d8;--txt2:#9a9488;--txt3:#5a5650;
  --red:#c44840;--blue:#4888c0;--green:#3a9a58;
  --purple:#8860b8;--cyan:#3aa8a8;--orange:#c87830;
  --mono:'DM Mono','Courier New',monospace;
  --sans:'Noto Sans SC','Helvetica Neue',sans-serif;
  --serif:'Instrument Serif','Georgia',serif;
  --display:'Playfair Display','Georgia',serif;
}
html{scroll-behavior:smooth;font-size:15px}
body{
  font-family:var(--sans);background:var(--bg);color:var(--txt);
  line-height:1.8;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 20% 10%,rgba(212,168,67,.025) 0%,transparent 55%),
    radial-gradient(ellipse at 80% 85%,rgba(72,136,192,.02) 0%,transparent 50%);
  pointer-events:none;z-index:0;
}

/* ── NAV ── */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:200;
  background:rgba(6,6,10,.88);backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(212,168,67,.06);
  padding:.6rem 1.2rem;
  box-shadow:0 4px 18px rgba(0,0,0,0.4);
}
.nav-in{
  max-width:1300px;margin:0 auto;
  display:flex;align-items:center;gap:.6rem;overflow-x:auto;
  scrollbar-width:none;
}
.nav-in::-webkit-scrollbar{display:none}
.nav-logo{
  font-family:var(--sans);font-weight:700;font-size:1.1rem;
  color:var(--txt);margin-right:.8rem;white-space:nowrap;flex-shrink:0;
  border-right:1px solid rgba(255,255,255,0.08);padding-right:12px;
}
.nav a{
  font-family:var(--sans);font-size:.85rem;color:var(--txt2);
  text-decoration:none;font-weight:500;
  white-space:nowrap;padding:.4rem .8rem;border-radius:999px;
  background:var(--s2);border:1px solid rgba(255,255,255,0.02);
  transition:all .2s ease;flex-shrink:0;
}
.nav a:hover, .nav a.active{
  color:#fff;background:var(--gold-d);border-color:var(--gold);transform:translateY(-1px);
}
.nav a.nav-table-btn {
  background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;
  font-weight:600;box-shadow:0 4px 12px rgba(37,99,235,0.25);border:none;
}
.nav a.nav-table-btn:hover { background:linear-gradient(135deg,#3b82f6,#6366f1); }

/* ── HERO ── */
.hero{
  min-height:55vh;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;
  padding:7rem 1.5rem 2.5rem;position:relative;
}
.hero-kicker{
  font-family:var(--mono);font-size:.6rem;color:var(--gold-d);
  letter-spacing:.3em;text-transform:uppercase;margin-bottom:.8rem;
  opacity:0;animation:fadeUp .6s ease forwards .1s;
}
.hero h1{
  font-family:var(--display);font-weight:700;font-style:italic;
  font-size:clamp(2.2rem,5.5vw,4.2rem);
  color:var(--txt);line-height:1.15;
  opacity:0;animation:fadeUp .8s ease forwards .25s;
}
.hero h1 em{color:var(--gold);font-style:italic}
.hero .sub{
  font-size:.9rem;color:var(--txt2);max-width:520px;margin:1rem auto 0;
  opacity:0;animation:fadeUp .7s ease forwards .45s;
}
.hero-line{
  width:28px;height:2px;background:var(--gold);
  margin:1.3rem auto;opacity:0;animation:fadeUp .5s ease forwards .6s;
}
.hero-stats{
  display:flex;gap:2rem;
  opacity:0;animation:fadeUp .6s ease forwards .7s;
}
.hero-stats .st{text-align:center}
.hero-stats .sv{font-family:var(--display);font-weight:700;font-size:1.6rem;color:var(--gold)}
.hero-stats .sl{font-family:var(--mono);font-size:.55rem;color:var(--txt3);letter-spacing:.1em;text-transform:uppercase}

/* ── MAIN ── */
main{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 1.2rem}

/* ── SCENE ── */
.scene{margin:4rem 0 2rem;position:relative}
.scene-head{
  display:flex;align-items:flex-end;gap:1rem;
  margin-bottom:2rem;flex-wrap:wrap;
}
.sn{
  font-family:var(--display);font-style:italic;font-weight:700;
  font-size:3.8rem;line-height:.85;color:rgba(212,168,67,.1);
  flex-shrink:0;
}
.stb{flex:1;min-width:180px}
.sq{
  font-family:var(--mono);font-size:.58rem;color:var(--gold-d);
  letter-spacing:.2em;text-transform:uppercase;margin-bottom:.15rem;
}
.stitle{
  font-family:var(--display);font-style:italic;font-weight:700;
  font-size:clamp(1.3rem,3vw,2.1rem);color:var(--txt);line-height:1.25;
}
.salt{font-family:var(--mono);font-size:.62rem;color:var(--txt3);letter-spacing:.06em;margin-top:.2rem}
.sline{
  width:100%;height:1px;
  background:linear-gradient(90deg,rgba(212,168,67,.12),transparent);
  margin-top:.8rem;
}

/* ── PLAT CARD ── */
a.plat, .plat{
  display:block;background:var(--s1);
  border:1px solid rgba(255,255,255,.035);border-radius:10px;
  margin-bottom:1rem;overflow:hidden;
  transition:border-color .3s,transform .25s,box-shadow .25s;
  opacity:0;transform:translateY(20px);
  text-decoration:none;color:inherit;cursor:pointer;
}
a.plat.revealed,.plat.revealed{opacity:1;transform:translateY(0);transition:opacity .5s ease,transform .5s ease,border-color .3s}
a.plat:hover,.plat:hover{
  border-color:rgba(212,168,67,.15);transform:translateY(-2px);
  box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.ph{display:flex;align-items:center;gap:.8rem;padding:1.2rem 1.5rem .8rem;flex-wrap:wrap}
.pi{
  width:42px;height:42px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.95rem;color:#fff;
  flex-shrink:0;position:relative;
}
.pi::after{
  content:'';position:absolute;inset:-2px;border-radius:12px;
  border:1px solid rgba(255,255,255,.05);
}
.pn{font-family:var(--display);font-style:italic;font-weight:700;font-size:1.35rem;color:var(--txt);line-height:1.1}
.ps{font-family:var(--mono);font-size:.55rem;color:var(--txt3);letter-spacing:.06em;margin-top:.1rem}
.pbs{margin-left:auto;display:flex;gap:.35rem;flex-wrap:wrap}
.bg{
  font-family:var(--mono);font-size:.5rem;letter-spacing:.05em;
  text-transform:uppercase;padding:.15rem .4rem;border-radius:3px;
}
.bg-p{background:rgba(212,168,67,.1);color:var(--gold)}
.bg-a{background:rgba(72,136,192,.1);color:var(--blue)}
.bg-s{background:rgba(58,154,88,.08);color:var(--green)}
.bg-r{background:rgba(196,72,64,.1);color:var(--red)}
.bg-u{background:rgba(136,96,184,.08);color:var(--purple)}

.pb{padding:0 1.5rem 1.4rem}
.pt{font-size:.85rem;color:var(--txt2);line-height:1.8;margin-bottom:.6rem}
.pt strong{color:var(--txt);font-weight:500}

.feats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:.5rem;margin:.5rem 0;
}
.feat{
  background:var(--s2);border-radius:5px;padding:.55rem .75rem;
  border:1px solid rgba(255,255,255,.02);
}
.feat-l{
  font-family:var(--mono);font-size:.5rem;color:var(--gold-d);
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:.1rem;
}
.feat-v{font-size:.78rem;color:var(--txt2)}

.sbox{
  background:var(--s2);border-left:3px solid var(--gold-d);
  border-radius:0 6px 6px 0;padding:.8rem 1.2rem;margin-top:.6rem;
}
.sbox-t{
  font-family:var(--mono);font-size:.55rem;color:var(--gold);
  letter-spacing:.15em;text-transform:uppercase;margin-bottom:.2rem;
}
.sbox p{font-size:.8rem;color:var(--txt2);line-height:1.65}

.alt{
  background:rgba(72,136,192,.04);border-left:3px solid rgba(72,136,192,.18);
  border-radius:0 6px 6px 0;padding:.7rem 1.1rem;margin-top:.4rem;
}
.alt-t{
  font-family:var(--mono);font-size:.5rem;color:var(--blue);
  letter-spacing:.1em;text-transform:uppercase;margin-bottom:.15rem;
}
.alt p{font-size:.78rem;color:var(--txt2);line-height:1.6}

/* ── BRAND ICON GRADIENTS ── */
.ic-wb{background:linear-gradient(135deg,#e64020,#a01810)}
.ic-tt{background:linear-gradient(135deg,#282828,#181818)}
.ic-zh{background:linear-gradient(135deg,#1888e0,#0c50a0)}
.ic-gg{background:linear-gradient(135deg,#4888f0,#2858b0)}
.ic-bi{background:linear-gradient(135deg,#40a0f0,#2068c0)}
.ic-xhs{background:linear-gradient(135deg,#f04040,#c02020)}
.ic-smzdm{background:linear-gradient(135deg,#e85020,#a83010)}
.ic-db{background:linear-gradient(135deg,#30a838,#186820)}
.ic-hp{background:linear-gradient(135deg,#e84028,#a82818)}
.ic-zb8{background:linear-gradient(135deg,#2078c0,#104878)}
.ic-36k{background:linear-gradient(135deg,#1080f0,#0848a0)}
.ic-hx{background:linear-gradient(135deg,#f06020,#a03810)}
.ic-sspai{background:linear-gradient(135deg,#d83030,#901818)}
.ic-dy{background:linear-gradient(135deg,#181818,#000)}
.ic-ks{background:linear-gradient(135deg,#f0a020,#c07010)}
.ic-yt{background:linear-gradient(135deg,#f02020,#a01010)}
.ic-ka{background:linear-gradient(135deg,#28a848,#187028)}
.ic-ithome{background:linear-gradient(135deg,#d83820,#981010)}
.ic-thepaper{background:linear-gradient(135deg,#2048a0,#102858)}
.ic-rdhub{background:linear-gradient(135deg,#3080d0,#185088)}
.ic-tb{background:linear-gradient(135deg,#4888f0,#2058b0)}
.ic-v2ex{background:linear-gradient(135deg,#333,#1a1a1a)}
.ic-ifanr{background:linear-gradient(135deg,#202020,#0a0a0a)}
.ic-pw{background:linear-gradient(135deg,#6040a0,#302060)}
.ic-default{background:linear-gradient(135deg,var(--gold-d),var(--s3))}

/* ── TABLE ── */
.qt{
  margin:3.5rem 0 2rem;border:1px solid rgba(255,255,255,.04);
  border-radius:10px;overflow:hidden;opacity:0;transform:translateY(18px);
}
.qt.revealed{opacity:1;transform:translateY(0);transition:opacity .5s ease,transform .5s ease}
.qt-h{background:var(--s2);padding:1.2rem 1.5rem;border-bottom:1px solid rgba(255,255,255,.04)}
.qt-h h2{font-family:var(--display);font-style:italic;font-weight:700;font-size:1.4rem;color:var(--gold)}
.qt-h p{font-size:.78rem;color:var(--txt3);margin-top:.15rem}
table{width:100%;border-collapse:collapse}
thead th{
  background:var(--s1);font-family:var(--mono);font-weight:400;
  font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold-d);padding:.65rem 1.2rem;text-align:left;
  border-bottom:1px solid rgba(255,255,255,.04);
}
tbody td{padding:.6rem 1.2rem;border-bottom:1px solid rgba(255,255,255,.02);font-size:.82rem;color:var(--txt2)}
tbody tr{transition:background .2s}
tbody tr:hover{background:rgba(212,168,67,.02)}
td.sc{color:var(--txt);font-weight:500}
td.pc{font-family:var(--mono);font-size:.75rem;display:flex;align-items:center;gap:.4rem}
.pd{width:7px;height:7px;border-radius:50%;flex-shrink:0}
td.ac{font-family:var(--sans);font-size:.75rem;color:var(--txt2)}
td.ac a{color:var(--gold);text-decoration:none;margin-right:6px}
td.ac a:hover{text-decoration:underline}

/* ── DIV ── */
.div{display:flex;align-items:center;gap:1rem;margin:4rem 0 0}
.div span{font-family:var(--mono);font-size:.52rem;color:var(--txt3);letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
.div::before,.div::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.04)}

/* ── FOOTER ── */
footer{
  margin:3rem 0 0;padding:2.5rem 1.5rem;border-top:1px solid rgba(255,255,255,.04);text-align:center;
  font-family:var(--mono);font-size:.6rem;color:var(--txt3);letter-spacing:.06em;
}
footer em{color:var(--gold-d);font-style:normal}

/* ── BTT ── */
.btt{
  position:fixed;bottom:1.5rem;right:1.5rem;z-index:100;
  width:36px;height:36px;border-radius:50%;
  background:var(--s2);border:1px solid rgba(212,168,67,.1);
  color:var(--gold);font-size:.9rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;
}
.btt.show{opacity:1;transform:translateY(0)}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:768px){
  .sn{font-size:2.5rem}
  .ph{padding:1rem 1rem .6rem}
  .pb{padding:0 1rem 1.2rem}
  .feats{grid-template-columns:1fr}
  .pbs{margin-left:0;margin-top:.3rem}
  td.pc{font-size:.65rem}
  thead th,tbody td{padding:.5rem .7rem}
  .hero h1{font-size:1.8rem}
  .hero-stats .sv{font-size:1.3rem}
}
</style>
</head>

<!-- ════════ NAV (Dynamic Driven) ════════ -->
<nav class="nav">

  </div>
</main>

<footer>

<button class="btt" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

// ══════════════════════════════════════════════════════════════
// 🚀 DYNAMIC ENGINE (动态解析渲染引擎脚本，请保持其完整性)
// ══════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  const navContainer = document.getElementById('dynamic-nav-container');
  const mainContent = document.getElementById('dynamic-main-content');
  const tableBody = document.getElementById('dynamic-table-body');
  
  let totalPlatsCount = 0;

  // 渲染导航与主卡片流
  SCENES_DATA.forEach((scene) => {
    // 1. 生成导航锚点
    const navLink = document.createElement('a');
    navLink.href = `#${scene.id}`;
    navLink.setAttribute('data-scene', scene.id);
    navLink.textContent = `${scene.num} ${scene.title.split('—')[0] || scene.title}`;
    navContainer.appendChild(navLink);

    // 2. 生成场景块框架
    const sceneSection = document.createElement('div');
    sceneSection.id = scene.id;
    sceneSection.className = 'scene';

    let platsHTML = '';
    scene.platforms.forEach((plat) => {
      totalPlatsCount++;
      
      // 构建属性徽章
      let badgesHTML = '';
      if (plat.badges) {
        plat.badges.forEach((b, idx) => {
          const badgeClasses = ['bg-p', 'bg-a', 'bg-s', 'bg-r', 'bg-u'];
          const bClass = badgeClasses[idx % badgeClasses.length];
          badgesHTML += `<span class="bg ${bClass}">${b}</span>`;
        });
      }

      // 构建段落
      let parasHTML = '';
      plat.paragraphs.forEach(p => {
        parasHTML += `<div class="pt">${p}</div>`;
      });

      // 构建三维特征元
      let featsHTML = '';
      if (plat.feats) {
        featsHTML += `<div class="feats">`;
        plat.feats.forEach(f => {
          featsHTML += `<div class="feat"><div class="feat-l">${f.label}</div><div class="feat-v">${f.val}</div></div>`;
        });
        featsHTML += `</div>`;
      }

      // 构建特别适合场景框
      let sboxHTML = '';
      if (plat.sbox) {
        sboxHTML += `<div class="sbox"><div class="sbox-t">适合你的场景</div><p>${plat.sbox}</p></div>`;
      }

      // 构建横向对比框
      let altHTML = '';
      if (plat.altBox) {
        altHTML += `<div class="alt"><div class="alt-t">${plat.altBox.title}</div><p>${plat.altBox.content}</p></div>`;
      }

      // 聚合卡片
      platsHTML += `
        <a class="plat" href="${plat.url}" target="_blank" rel="noopener">
          <div class="ph">
            <div class="pi ${plat.iconClass || 'ic-default'}">${plat.iconText || plat.name.charAt(0)}</div>
            <div><div class="pn">${plat.name}</div><div class="ps">${plat.subText}</div></div>
            <div class="pbs">${badgesHTML}</div>
          </div>
          <div class="pb">
            ${parasHTML}
            ${featsHTML}
            ${sboxHTML}
            ${altHTML}
          </div>
        </a>
      `;
    });

    sceneSection.innerHTML = `
      <div class="scene-head">
        <div class="sn">${scene.num}</div>
        <div class="stb">
          <div class="sq">${scene.question}</div>
          <h2 class="stitle">${scene.title}</h2>
          <div class="salt">${scene.alt}</div>
        </div>
      </div>
      <div class="sline"></div>
      ${platsHTML}
    `;
    mainContent.appendChild(sceneSection);
  });

  // 3. 构建附加导航控制项
  if (NAV_CONFIG.showTableBtn) {
    const tableLink = document.createElement('a');
    tableLink.href = `#${NAV_CONFIG.tableAnchor}`;
    tableLink.setAttribute('data-scene', NAV_CONFIG.tableAnchor);
    tableLink.className = 'nav-table-btn';
    tableLink.textContent = NAV_CONFIG.tableBtnText;
    navContainer.appendChild(tableLink);
  }

  // 4. 驱动表格速查表动态提取
  SCENES_DATA.forEach((scene) => {
    const row = document.createElement('tr');
    
    // 抓取标星首选平台
    const primaryPlat = scene.platforms.find(p => p.isPrimary) || scene.platforms[0];
    
    // 收集辅助替代平台
    const altPlatsList = scene.platforms.filter(p => p.name !== primaryPlat.name);
    let altLinksHTML = altPlatsList.map(p => `<a href="${p.url}" target="_blank" rel="noopener">${p.name}</a>`).join(' / ');
    if(!altLinksHTML) altLinksHTML = '<span style="color:var(--txt3)">暂无替代</span>';

    // 提取对应颜色点
    let dotColor = '#d4a843';
    const cardEl = document.querySelector(`.${primaryPlat.iconClass}`);
    if (cardEl) {
      const computedBg = window.getComputedStyle(cardEl).background;
      const rgbMatch = computedBg.match(/rgb\([^)]+\)/);
      if (rgbMatch) dotColor = rgbMatch[0];
    }

    row.innerHTML = `
      <td class="sc">${scene.title}</td>
      <td class="pc"><span class="pd" style="background:${dotColor}"></span><a href="${primaryPlat.url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${primaryPlat.name}</a></td>
      <td class="ac">${altLinksHTML}</td>
    `;
    tableBody.appendChild(row);
  });

  // 更新各种仪表盘统计数字
  document.getElementById('stat-scenes').textContent = SCENES_DATA.length;
  document.getElementById('stat-plats').textContent = totalPlatsCount;
  document.getElementById('footer-sc-count').textContent = SCENES_DATA.length;
  document.getElementById('footer-pl-count').textContent = totalPlatsCount;

  // ════════ INTERSECTION OBSERVER & INTERACTION ════════
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('revealed');
        const cards = e.target.querySelectorAll('.plat, a.plat');
        cards.forEach((c, i) => { c.style.transitionDelay = `${i * .08}s`; c.classList.add('revealed') });
      }
    });
  }, { threshold: .02, rootMargin: '0px 0px -10px 0px' });
  document.querySelectorAll('.scene, .qt').forEach(el => obs.observe(el));

  const navLinks = document.querySelectorAll('.nav a[data-scene]');
  const sections = [];
  navLinks.forEach(a => {
    const id = a.getAttribute('data-scene');
    const el = document.getElementById(id);
    if (el) sections.push({ id, el, link: a });
  });

  const updateNav = () => {
    const scrollY = window.scrollY + 100;
    let current = '';
    sections.forEach(s => { if (s.el.offsetTop <= scrollY) current = s.id });
    navLinks.forEach(a => {
      a.classList.toggle('active', a.getAttribute('data-scene') === current);
    });
  };
  window.addEventListener('scroll', updateNav, { passive: true });
  updateNav();

  document.querySelectorAll('.nav a[href^="#"]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const t = document.querySelector(a.getAttribute('href'));
      if (t) { window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 65, behavior: 'smooth' }) }
    });
  });

  const btt = document.querySelector('.btt');
  window.addEventListener('scroll', () => { btt.classList.toggle('show', window.scrollY > 400) }, { passive: true });
});
</script>
