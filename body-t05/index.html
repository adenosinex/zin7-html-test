<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>骨骼肌量与肌纤维</title><style>
:root{--bg:#f7f2e9;--ink:#2b2620;--mut:#7a7264;--acc:#b4552d;--card:#fffdf8;--line:#e3dac8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC",serif;line-height:1.75}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 60px}

</style></head>
<body><div class="wrap">

<script id="dimension-data" type="application/json">{"stages": [{"age": "0–20 岁", "title": "儿童与青春期蓄积", "what": "青春期睾酮激增带动男性骨骼肌横截面积与瘦体重快速扩张，上肢及躯干增幅尤为突出；女性在雌激素主导下肌量稳步增长且体脂同步上升，绝对骨骼肌总量约为同龄男性的 60%–70%。", "normal": "身高突增期后肌肉填充跟进，运动习惯决定早期卫星细胞储备。", "warn": ""}, {"age": "20–30 岁", "title": "青年峰值平台期", "what": "男女骨骼肌量与四肢骨骼肌质量指数（ASMI）均达到终身峰值；女性绝对储备池低于男性，直接决定晚年安全垫厚度。", "normal": "代谢与恢复能力最佳，合成代谢敏感度处于一生最高期。", "warn": ""}, {"age": "30–50 岁", "title": "成年早期隐匿下滑", "what": "30 岁后开始出现每十年 3%–8% 的隐性肌量回落，常被体重不变或脂肪增加掩盖；女性生育期后若缺乏抗阻训练，核心与下肢肌量率先下滑。", "normal": "肌肉紧致度与力量应保持稳定。", "warn": "出现隐性肥胖或肌少性肥胖苗头，体重秤读数未变但肌肉紧致度明显下降。"}, {"age": "50–65 岁", "title": "中年转折与绝经加速", "what": "男性游离睾酮缓慢下降，60 岁起肌量流失斜率明显变陡；女性围绝经期至绝经后（中国女性自然绝经平均约 49.5 岁，欧美约 51 岁），雌激素骤降伴随肌内脂肪浸润增加与肌质量下降。", "normal": "维持下肢力量与肌肉储备，对抗流失加速。", "warn": "爬楼发沉、提重物耐力下降、餐后血糖波动增大。"}, {"age": "65–80+ 岁", "title": "老年少肌症高发期", "what": "75 岁左右年均肌量流失男性达 0.80%–0.98%/年，女性约 0.64%–0.70%/年；中国社区 ≥80 岁男性少肌症患病率升至 33.1%；女性因起点基线低更易跌破独立生活所需下肢肌量红线。", "normal": "80 岁前重点维持肌肉质量，80 岁后重点提升肌力与躯体功能以防失能。", "warn": "步速放缓、座椅起立困难、跌倒与骨折风险激增。"}], "redflags": [{"signal": "小腿围男 < 34 cm / 女 < 33 cm，或 SARC-F 问卷 ≥ 4 分，或 SARC-CalF ≥ 11 分", "action": "提示少肌症初筛阳性，需进一步进行握力测定与躯体功能临床检查。"}, {"signal": "握力男 < 28 kg / 女 < 18 kg（AWGS标准，EWGSOP2 为男 < 27 kg / 女 < 16 kg），或 5 次坐站测试 ≥ 12 秒（EWGSOP2 为 > 15 秒）", "action": "提示肌力受损（可能少肌症），应尽快进行双能 X 射线（DXA）或人体成分（BIA）确诊肌量，并启动渐进式抗阻训练。"}, {"signal": "四肢骨骼肌质量指数（ASMI）DXA 测定男 < 7.0 kg/m² / 女 < 5.4 kg/m²（BIA 测定男 < 7.0 kg/m² / 女 < 5.7 kg/m²）", "action": "临床确诊少肌症，需专科医生排查继发病因，同步启动机械抗阻训练与单餐优质蛋白脉冲营养干预。"}, {"signal": "日常步行速度 6 米步速 < 1.0 m/s（或 4 米步速 ≤ 0.8 m/s），或 SPPB 评分 ≤ 9 分（EWGSOP2 为 ≤ 8 分）", "action": "已达重度少肌症标准，面临高度失能与跌倒骨折风险，需立即开展跌倒风险管理并接受专业神经肌肉康复训练。"}, {"signal": "50–64 岁握力男 < 34 kg / 女 < 20 kg（AWGS 2025 中年档）", "action": "中年段就开始抗阻训练，不要等跌破 65 岁阈值才干预"}, {"signal": "非刻意体重下降：6 个月内超过 5%", "action": "排查肌量流失与潜在疾病，同步补蛋白与抗阻训练"}], "levers": [{"name": "中大负荷渐进式抗阻训练", "effect": "每周 2–3 次；高龄衰弱老人干预 10 周可使下肢肌力提升 113% ± 8%、步速提升 11.8% ± 3.8%、爬楼功率提升 28.4% ± 6.6%、大腿肌肉横截面积增加 2.7% ± 1.8%；12 个月可使肌纤维直径增加 18.6 μm 并改善线粒体功能。", "note": "重点募集下肢与核心 II 型快肌纤维；单纯散步或低强度有氧无法有效阻断 II 型肌纤维萎缩。"}, {"name": "抗阻联合亮氨酸/优质蛋白质脉冲摄入", "effect": "克服中老年合成代谢抵抗，有效激活老年肌肉 mTORC1 通路与肌肉蛋白质合成。", "note": "必须与机械张力抗阻训练协同触发；仅靠多营养素补充而不配合抗阻训练，对肌力与躯体衰弱无显著改善。"}], "insight": "骨骼肌是终身可逆的动力与代谢储备库，30岁后隐性萎缩、60岁加速流失，保住快肌纤维必须靠规律抗阻训练。", "mechanism": {"nodes": [{"t": "合成代谢抵抗", "d": "中老年肌肉对相同剂量氨基酸或低强度活动刺激迟钝，蛋白质合成与分解持续处于净赤字。"}, {"t": "快肌选择性萎缩", "d": "负责爆发力与防跌倒的 II 型快肌纤维及其周围卫星细胞优先萎缩退化，与年龄流失呈强负相关。"}, {"t": "运动单位重塑", "d": "脊髓运动神经元退化伴随慢肌神经再支配，导致快肌向慢肌漂移、肌内脂肪浸润，引发功能失能。"}], "note": "骨骼肌衰退的核心是由合成代谢抵抗驱动的蛋白质净赤字，以及 II 型快肌纤维的选择性萎缩与神经重塑，唯有抗阻机械张力可终身提供逆转刺激。"}, "claims": [{"id": "T05-C01", "claim": "成年人在 30 岁以后骨骼肌质量每十年平均流失约 3%–8%，并在 60 岁以后进入加速衰退通道。", "verdict": "VERIFIED", "source": "PMC2804956"}, {"id": "T05-C02", "claim": "在 75 岁人群中，骨骼肌质量的年均流失率在男性中约为 0.80%–0.98%/年，在女性中约为 0.64%–0.70%/年。", "verdict": "VERIFIED", "source": "PMC3429036"}, {"id": "T05-C03", "claim": "若缺乏长期抗阻干预，到 80–90 岁高龄时累计骨骼肌量损失可接近青年峰值的 50%。", "verdict": "VERIFIED", "source": "PMID 30048806"}, {"id": "T05-C04", "claim": "老年肌肉存在合成代谢抵抗，相同剂量的膳食蛋白质摄入或低强度活动触发 mTORC1 通路与新肌蛋白合成的效率显著低于青年期。", "verdict": "VERIFIED", "source": "PMC6202460"}, {"id": "T05-C05", "claim": "某块肌肉中 II 型肌纤维所占比例越高，其随年龄萎缩的程度越严重，相关系数 r = -0.73。", "verdict": "VERIFIED", "source": "PMC10069966"}, {"id": "T05-C06", "claim": "衰老过程中 II 型快肌纤维不仅横截面积显著缩减，其周围的肌卫星细胞数量与激活能力也优先衰减。", "verdict": "VERIFIED", "source": "PMC11782179"}, {"id": "T05-C07", "claim": "在中国社区 ≥60 岁男性队列中，按 AWGS 2019 标准，60–69 岁、70–79 岁及 ≥80 岁少肌症患病率分别为 1.5%、9.6% 和 33.1%。", "verdict": "VERIFIED", "source": "PMC9682713"}, {"id": "T05-C08", "claim": "10 周高强度渐进抗阻训练使高龄衰弱老人下肢肌力提升 113% ± 8%、步速提升 11.8% ± 3.8%、爬楼功率提升 28.4% ± 6.6%、大腿肌肉横截面积增加 2.7% ± 1.8%，而单纯多营养素补充无显著改善。", "verdict": "VERIFIED", "source": "PMID 8190152"}, {"id": "T05-C09", "claim": "12 个月抗阻肌疗使衰弱慢病患者肌纤维直径显著增加 18.6 μm，肌萎缩标志物下降且线粒体氧化功能复合体 IV 与 ATP5I 改善。", "verdict": "VERIFIED", "source": "PMC11978330"}], "dim": "T05", "title": "骨骼肌量与肌纤维", "subtitle": "肌肉储备：一生中先存后取的账户", "model_note": "内容稿件：用户提供的第 2 批 MD 稿件；数值经来源核查锁定；结构化：Vertex Gemini 3.8 Flash；本页由确定性模板渲染。"}</script>
<script>
const D=JSON.parse(document.getElementById('dimension-data').textContent);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('stages').innerHTML=D.stages.map(s=>`<div class="stage"><div class="age">${esc(s.age)}</div>${s.title&&s.title!==s.age?`<h3>${esc(s.title)}</h3>`:''}<p>${esc(s.what)}</p>${s.normal?`<p class="normal">正常范围：${esc(s.normal)}</p>`:''}${s.warn?`<p class="warn">留意：${esc(s.warn)}</p>`:''}</div>`).join('');
document.getElementById('redflags').innerHTML=D.redflags.map(r=>`<tr><td>${esc(r.signal)}</td><td>${esc(r.action)}</td></tr>`).join('');
document.getElementById('levers').innerHTML=D.levers.map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(l.effect)}</td><td>${esc(l.note||'')}</td></tr>`).join('');
document.getElementById('insight').textContent=D.insight;
document.getElementById('claims').innerHTML=D.claims.map(c=>`<tr><td>${esc(c.id)}</td><td>${esc(c.claim)}</td><td>${esc(c.verdict)}</td><td>${esc(c.source)}</td></tr>`).join('');
// mechanism nodes
const nodes=D.mechanism.nodes||[];const W=820,H=120;
let svg=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
nodes.forEach((n,i)=>{const x=nodes.length>1?100+i*(W-200)/(nodes.length-1):W/2;
 if(i>0){const px=100+(i-1)*(W-200)/(nodes.length-1);svg+=`<line x1="${px+18}" y1="60" x2="${x-18}" y2="60" stroke="#b4552d" stroke-width="2"/>`;}
 svg+=`<g class="node" data-i="${i}"><circle cx="${x}" cy="60" r="18"/><text x="${x}" y="65" text-anchor="middle">${i+1}</text></g><text x="${x}" y="100" text-anchor="middle" font-size="12" fill="#2b2620">${esc(n.t)}</text>`;});
svg+='</svg>';
document.getElementById('mechsvg').innerHTML=svg;
const md=document.getElementById('mechdesc');
function show(i){md.innerHTML=`<b>${i+1}. ${esc(nodes[i].t)}</b>：${esc(nodes[i].d)}`;}
document.querySelectorAll('.node').forEach(g=>g.addEventListener('click',()=>show(+g.dataset.i)));
if(nodes.length)show(0);
document.getElementById('mechnote').textContent=D.mechanism.note||'';
// charts
function linePath(pts,x0,x1,y0,y1,vmin,vmax){return pts.map((p,i)=>{const x=x0+(x1-x0)*p[0]/100;const y=y1-(y1-y0)*(p[1]-vmin)/(vmax-vmin);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}).join(' ');}
function renderChart(ch){const W=820,H=300,x0=50,x1=790,y0=30,y1=260;
 let all=[];ch.series.forEach(s=>{(s.points||[]).forEach(p=>all.push(p[1]));(s.upper||[]).forEach(p=>all.push(p[1]));(s.lower||[]).forEach(p=>all.push(p[1]));});
 const vmin=Math.min(...all),vmax=Math.max(...all);const colors=['#b4552d','#3d6b8a','#7a9a3d','#8a5aa0'];
 let s=`<svg viewBox="0 0 ${W} ${H}">`;
 s+=`<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#7a7264"/><text x="${x0}" y="${y1+20}" font-size="12" fill="#7a7264">0岁</text><text x="${x1-30}" y="${y1+20}" font-size="12" fill="#7a7264">100岁</text>`;
 if(ch.type==='range_band'){ch.series.forEach((se,i)=>{const up=linePath(se.upper,x0,x1,y0,y1,vmin,vmax);const lo=linePath([...se.lower].reverse(),x0,x1,y0,y1,vmin,vmax);s+=`<path d="${up} ${lo.replace(/^M/,'L')} Z" fill="${colors[i%4]}" opacity="0.25"/><path d="${up}" fill="none" stroke="${colors[i%4]}" stroke-width="2"/>`;});}
 else if(ch.type==='stacked_area'){let base=ch.series[0].points.map(p=>[p[0],vmin]);ch.series.forEach((se,i)=>{const top=se.points.map((p,j)=>[p[0],base[j][1]+p[1]]);const tp=linePath(top,x0,x1,y0,y1,vmin,vmax);const bp=linePath([...base].reverse(),x0,x1,y0,y1,vmin,vmax);s+=`<path d="${tp} ${bp.replace(/^M/,'L')} Z" fill="${colors[i%4]}" opacity="0.5"/>`;base=top;});}
 else{ch.series.forEach((se,i)=>{s+=`<path d="${linePath(se.points,x0,x1,y0,y1,vmin,vmax)}" fill="none" stroke="${colors[i%4]}" stroke-width="2.5"/>`;});}
 ch.series.forEach((se,i)=>{s+=`<text x="${x0+i*160}" y="18" font-size="13" fill="${colors[i%4]}">${esc(se.name)}</text>`;});
 return s+'</svg>';}
if(D.chart){document.getElementById('chartwrap').innerHTML='<h2>一生曲线</h2>'+renderChart(D.chart);}
</script>
</body></html>
