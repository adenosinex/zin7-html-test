17岁时，高浓度雌二醇诱导生长板彻底矿化骨化，线性生长轴永久锁死）；绝经后始基卵泡库完全耗竭（跌破<1000个阈值后，卵母细胞池无法自发再生，排卵功能永久锁死）。"}, {"signal": "高回报干预窗", "action": "迷你青春期干预窗（出生后0-6月龄为隐睾与小阴茎促性腺激素治疗的最佳敏感窗，隐睾手术复位金标准截断为6-12/18月龄内，超时将导致生精细胞不可逆凋亡）；CPP药物阻断窗口（女孩在骨龄<11.5岁、男孩骨龄<12.5岁前应用GnRHa抑制骨龄飞跃、挽救成年终身高的获益最高）；生育潜能黄金储备窗（女性22-32岁卵巢AMH>2.0 ng/mL且卵母细胞非整倍体率<10%；男性20-35岁精子DNA断裂指数DFI<15%）。"}, {"signal": "只能延缓、不能逆转", "action": "围绝经期过渡阶段（45-50岁）：在绝经10年之内且年龄<60岁的时间窗（Window of Opportunity）开启更年期激素治疗（MHT/HRT），可显著延缓骨质疏松进程、减轻血管舒缩综合征及心血管代谢风险，但无法阻断原始卵泡库耗竭；男性迟发性性腺功能减退期（55-70岁）：睾酮替代疗法（TRT）可改善肌少症、内脏脂肪肥胖及勃起障碍，但无法逆转曲细精管基底膜玻璃样变与精子生成潜能的衰竭。"}], "levers": [{"name": "男性生殖轴发育、精子发生动力学与迟发性性腺功能减退（LOH）", "effect": "胚胎期第7周，Y染色体短臂SRY基因活化SOX9，指导双潜能性腺分化为睾丸支持细胞（Sertoli），合成分泌AMH诱导副中肾管凋亡退化；间质细胞（Leydig）在胎盘hCG驱动下分泌睾酮，并在泌尿生殖窦局部经5α-还原酶催化为活性双氢睾酮（DHT），诱发外生殖器男性化。生后1-3个月经历迷你青春期（血清T达1-12 nmol/L）后静默。青春期启动依赖脉冲式LH结合间质细胞LHR，激活PKA通路及StAR蛋白介导胆固醇向孕烯醇酮转运合成睾酮；FSH则作用于Sertoli细胞分泌雄激素结合蛋白（ABP）与抑制素B，维持局部微环境高浓度T以维系64-72天的生精周期。35-40岁后，睾丸Leydig细胞总数以每年约1%的速度凋亡，微血管硬化导致血流灌注降低；同时肝脏合成性激素结合球蛋白（SHBG）以每年1.2%-1.4%的速度持续递增，致使游离睾酮（FT）呈现更陡峭的年均1.6%-2.2%下降。当晨起血清总睾酮低于8.0-12.1 nmol/L（或游离睾酮低于220-240 pmol/L）且合并勃起障碍、体能下落及内脏脂肪蓄积时，生化与临床共同确立LOH诊断。", "note": "[分子机制深潜]"}, {"name": "女性卵泡储备衰竭动力学、Tanner分期演进与STRAW+10分期", "effect": "女性胚胎第20周原始卵泡储备达生命周期极值（约700万），出生时闭锁损耗至100-200万，青春期前进一步衰退至30-40万。青春期启动的核心为下丘脑弓状核KNDy神经元解除中枢制动，高频释放GnRH驱动垂体分泌促性腺激素。Tanner分期依序展开：B2（乳腺出芽，9.8-10.2岁，依赖雌激素）→B3/PHV（生长激素协同）→B4（乳晕乳头二次突起）→初潮（Menarche，中位12.5-12.8岁，发生于PHV减速期，初期多为无排卵周期）→B5（成人乳房形态）。始基卵泡的耗竭遵循两相非线性衰减模型：37.5岁前，每个月经周期伴随数十至数百个始基卵泡非受控募集闭锁；当残余卵泡池降至约25000个（37.5岁临界点）时，闭锁斜率突增约2倍。依据STRAW+10分期：围绝经早期（-2期）相邻月经周期差值≥7天；围绝经晚期（-1期）出现持续≥60天的闭经间隔，伴随抑制素B断崖式下落、AMH跌入检测限以下及血清FSH代偿性上升（>25 IU/L）；当最终闭经≥12个月即确立最终月经绝经（0期，中位51.4岁），此时卵泡池已跌破临界耗竭阈值（<1000个），全轴系进入永久性低雌激素与高促性腺激素状态。", "note": "[分子机制深潜]"}, {"name": "妊娠与哺乳期母体生殖神经内分泌-代谢重塑网络", "effect": "受精卵着床后，合胞体滋养层细胞分泌hCG，特异性激动黄体LH受体，维持妊娠黄体分泌孕酮与雌激素至孕8-10周完成黄体-胎盘转移。胎盘随后转变为主要内分泌器官，大量合成分泌胎盘催乳素（hPL）、胎盘生长激素（PGH）、孕酮及雌三醇（E3），不仅深度阻断母体垂体GnRH脉冲释放，还诱导母体外周胰岛素抵抗，确保母胎营养优先分流。分娩胎盘剥离后，高浓度孕酮与雌激素骤降，解除下丘脑对垂体催乳素（PRL）的转录抑制；新生儿吸吮刺激乳头神经末梢经脊髓-下丘脑通路，下调弓状核多巴胺释放，促进垂体PRL大量分泌，同时室旁核/视上核脉冲式释放催产素（OT）引发肌上皮细胞收缩（喷乳反射）。更为关键的是，持续高浓度的PRL通过抑制弓状核KNDy神经元的Kisspeptin表达，深度下调GnRH脉冲发生器的脉冲振幅与频率，使垂体无法产生触发排卵的LH峰，从而在全母乳喂养期间维持生理性下丘脑闭经（哺乳期无排卵闭经，LAM避孕机制）。", "note": "[分子机制深潜]"}, {"name": "性发育时序偏离：中枢性性早熟（CPP）与体质性青春期延迟（CDGP）机制阈值", "effect": "性发育启动时序受遗传网络、代谢营养信号（如瘦素Leptin临界阈值）及中枢神经递质平衡精密标定。中枢性性早熟（CPP）病理核心为HPG轴提前解除中枢制动，弓状核Kisspeptin-GPR54信号异常活化诱发真性GnRH阵发分泌。生化确诊金标准为GnRH激发试验：LH峰值>5.0 IU/L且LH/FSH峰值比>0.6。CPP的核心病理危害在于性激素提前大量暴露催化骺板软骨迅速分化成熟，使骨龄超越生理年龄≥2岁，骨骺过早闭合严重损耗成年终身高。体质性青春期发育延迟（CDGP）则为中枢成熟时钟异时化延迟表型，多伴家族遗传史，表现为下丘脑GnRH脉冲发生器再激活延迟，骨龄与身高生长曲线同步滞后2-3岁，但垂体生长激素储备完备。临床设定严格排查红线（女满13岁无乳腺出芽/男满14岁睾丸容积<4 mL），需通过低剂量短程性激素启动诱导治疗或GnRH促发试验排查卡尔曼综合征等先天性低促性腺激素性性腺功能减退症（CHH）。", "note": "[分子机制深潜]"}], "insight": "本图展示了身体如何调节性激素（HPG轴）。信号传导是关键：下丘脑发信号，垂体响应并发布指令，性腺执行并反馈。男婴出生后会经历“迷你青春期”，而女婴则是生殖激素波动；2-9岁时，身体进入“刹车”状态，发育静默；10-19岁时，大脑解除刹车，发育进入快车道；20-35岁达到生育能力高峰；女性45-55岁因卵泡耗尽，生殖功能断崖式下滑；男性则从40岁起，因细胞更新变慢和调节蛋白增加，出现平缓衰减，直至老年仅剩微量活性。", "mechanism": {"nodes": [{"t": "脉冲开关", "d": "新生儿脱离母体胎盘高浓度雌二醇负反馈后经历迷你青春期（Mini-puberty），男婴血清睾酮在1-3个月达峰值且于6个月前回落至静默期，女婴FSH与E2高水平脉冲波动持续至1-2岁"}, {"t": "青春期启动", "d": "青春期真性启动的生物学金标准：女童以Tanner B2（乳腺出芽）为临床起点，男童以Tanner G2（双侧Prader计睾丸容积≥4 mL）为客观形态学起点"}, {"t": "生育高峰", "d": "女性原始卵泡库不可逆加速递减，胎儿期20周达700万极值，出生时跌至100-200万，青春期初剩30-40万，37.5岁后闭锁动力学斜率突增"}, {"t": "激素退潮", "d": "妊娠早期合胞体滋养层分泌hCG以挽救妊娠黄体，哺乳期高催乳素（PRL）通过抑制KNDy神经元吻素释放产生生理性下丘脑闭经"}], "note": "三节点构成生殖轴的基本回路。"}, "claims": [{"id": "T02-C01", "claim": "新生儿脱离母体胎盘高浓度雌二醇负反馈后经历迷你青春期（Mini-puberty），男婴血清睾酮在1-3个月达峰值且于6个月前回落至静默期，女婴FSH与E2高水平脉冲波动持续至1-2岁", "verdict": "[VERIFIED]", "source": "Kuiri-Hänninen et al., Endocr Rev, 2014; PMID: 28628972"}, {"id": "T02-C02", "claim": "胎儿性分化依赖孕早期雄激素脉冲与抗苗勒管激素（AMH），SRY基因驱动睾丸支持细胞于孕7周分泌AMH，间质细胞于孕8-14周在hCG刺激下分泌睾酮", "verdict": "[VERIFIED]", "source": "Rey et al., Semin Reprod Med, 2012; Hughes et al., 2006"}, {"id": "T02-C03", "claim": "肾上腺机能初现（Adrenarche）与性腺机能初现（Gonadarche）在发生机制上解耦独立，前者表现为肾上腺皮质网状带CYB5A/SULT2A1激活致DHEA-S激增", "verdict": "[VERIFIED]", "source": "Auchus et al., 2004; PMID: 34250379"}, {"id": "T02-C04", "claim": "青春期真性启动的生物学金标准：女童以Tanner B2（乳腺出芽）为临床起点，男童以Tanner G2（双侧Prader计睾丸容积≥4 mL）为客观形态学起点", "verdict": "[VERIFIED]", "source": "PMID: 41921546; PMID: 12388944; PMID: 34250379"}, {"id": "T02-C05", "claim": "女性生长突增峰值（PHV）严格先于月经初潮，初潮通常发生在生长速度减速阶段及Tanner B4期，为雌激素对内膜突破性撤退机制", "verdict": "[VERIFIED]", "source": "Marshall & Tanner, Arch Dis Child, 1969; Biro et al., 2006"}, {"id": "T02-C06", "claim": "男性遗精（Oligarche）多出现在生长突增峰值（PHV）重叠期及Tanner G3-G4期，标志睾丸生精小管成熟精子发生通路完成功能闭环", "verdict": "[VERIFIED]", "source": "Nielsen et al., 1986; Kulin et al., 1989"}, {"id": "T02-C07", "claim": "女性原始卵泡库不可逆加速递减，胎儿期20周达700万极值，出生时跌至100-200万，青春期初剩30-40万，37.5岁后闭锁动力学斜率突增", "verdict": "[VERIFIED]", "source": "Faddy & Gosden, 1996; Wallace & Kelsey, PLoS ONE, 2010"}, {"id": "T02-C08", "claim": "女性自然绝经中位年龄为51.4岁，依据STRAW+10分期体系，围绝经期向绝经后过渡标志着卵巢原始卵泡池不可逆耗竭与排卵永久性终止", "verdict": "[VERIFIED]", "source": "STRAW+10 Collaborative Group, 2012; PMID: 41106025; PMID: 41156491"}, {"id": "T02-C09", "claim": "男性睾酮在35-40岁后呈平缓进行性衰退，肝脏SHBG年均递增导致游离睾酮（FT）下降速率显著高于总睾酮（TT）", "verdict": "[CORRECTED]", "source": "MMAS longitudinal study, Feldman et al., 2002; PMID: 27178254; PMID: 36038500"}, {"id": "T02-C10", "claim": "迟发性性腺功能减退（LOH）诊断必须同时结合典型临床症候群与清晨空腹静脉血清睾酮生化切点", "verdict": "[VERIFIED]", "source": "Endocrine Society Clinical Practice Guideline, Bhasin et al., 2018; PMID: 17171213"}, {"id": "T02-C11", "claim": "中枢性性早熟（CPP）定义为下丘脑GnRH脉冲发生器过早解禁激活，造成第二性征提前暴露及骨龄严重提前闭合", "verdict": "[VERIFIED]", "source": "Carel et al., Pediatrics, 2009; 中华医学会儿科学分会内分泌学组CPP指南"}, {"id": "T02-C12", "claim": "体质性青春期发育延迟（CDGP）呈现生殖轴重激活延迟与骨龄落后，需依据年龄截断值进行排查以排除器质性低促性腺激素性性腺功能减退", "verdict": "[VERIFIED]", "source": "Sedlmeyer & Palmert, Endocr Rev, 2002; Wei & Crowne, 2016"}, {"id": "T02-C13", "claim": "妊娠早期合胞体滋养层分泌hCG以挽救妊娠黄体，哺乳期高催乳素（PRL）通过抑制KNDy神经元吻素释放产生生理性下丘脑闭经", "verdict": "[VERIFIED]", "source": "McNeilly, Hum Reprod Update, 2001; Knobil and Neill's Physiology of Reproduction, 2015"}]}</script>
<script>
const D=JSON.parse(document.getElementById('dimension-data').textContent);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('stages').innerHTML=D.stages.map(s=>`<div class="stage"><div class="age">${esc(s.age)}</div>${s.title&&s.title!==s.age?`<h3>${esc(s.title)}</h3>`:''}<p>${esc(s.what)}</p>${s.normal?`<p class="normal">正常范围：${esc(s.normal)}</p>`:''}${s.warn?`<p class="warn">留意：${esc(s.warn)}</p>`:''}</div>`).join('');
document.getElementById('redflags').innerHTML=D.redflags.map(r=>`<tr><td>${esc(r.signal)}</td><td>${esc(r.action)}</td></tr>`).join('');
document.getElementById('levers').innerHTML=D.levers.map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(l.effect)}</td><td>${esc(l.note||'')}</td></tr>`).join('');
document.getElementById('insight').textContent=D.insight;
document.getElementById('claims').innerHTML=D.claims.map(c=>`<tr><td>${esc(c.id)}</td><td>${esc(c.claim)}</td><td>${esc(c.verdict)}</td><td>${esc(c.source)}</td></tr>`).join('');
// mechanism nodes
const nodes=D.mechanism.nodes||[];const W=820,H=120;
let svg=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
nodes.forEach((n,i)=>{const x=nodes.length>1?100+i*(W-200)/(nodes.length-1):W/2;
 if(i>0){const px=100+(i-1)*(W-200)/(nodes.length-1);svg+=`<line x1="${px+18}" y1="60" x2="${x-18}" y2="60" stroke="#b4552d" stroke-width="2"/>`;}
 svg+=`<g class="node" data-i="${i}"><circle cx="${x}" cy="60" r="18"/><text x="${x}" y="65" text-anchor="middle">${i+1}</text></g><text x="${x}" y="100" text-anchor="middle" font-size="12" fill="#2b2620">${esc(n.t)}</text>`;});
svg+='</svg>';
document.getElementById('mechsvg').innerHTML=svg;
const md=document.getElementById('mechdesc');
function show(i){md.innerHTML=`<b>${i+1}. ${esc(nodes[i].t)}</b>：${esc(nodes[i].d)}`;}
document.querySelectorAll('.node').forEach(g=>g.addEventListener('click',()=>show(+g.dataset.i)));
if(nodes.length)show(0);
document.getElementById('mechnote').textContent=D.mechanism.note||'';
// charts
function linePath(pts,x0,x1,y0,y1,vmin,vmax){return pts.map((p,i)=>{const x=x0+(x1-x0)*p[0]/100;const y=y1-(y1-y0)*(p[1]-vmin)/(vmax-vmin);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}).join(' ');}
function renderChart(ch){const W=820,H=300,x0=50,x1=790,y0=30,y1=260;
 let all=[];ch.series.forEach(s=>{(s.points||[]).forEach(p=>all.push(p[1]));(s.upper||[]).forEach(p=>all.push(p[1]));(s.lower||[]).forEach(p=>all.push(p[1]));});
 const vmin=Math.min(...all),vmax=Math.max(...all);const colors=['#b4552d','#3d6b8a','#7a9a3d','#8a5aa0'];
 let s=`<svg viewBox="0 0 ${W} ${H}">`;
 s+=`<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#7a7264"/><text x="${x0}" y="${y1+20}" font-size="12" fill="#7a7264">0岁</text><text x="${x1-30}" y="${y1+20}" font-size="12" fill="#7a7264">100岁</text>`;
 if(ch.type==='range_band'){ch.series.forEach((se,i)=>{const up=linePath(se.upper,x0,x1,y0,y1,vmin,vmax);const lo=linePath([...se.lower].reverse(),x0,x1,y0,y1,vmin,vmax);s+=`<path d="${up} ${lo.replace(/^M/,'L')} Z" fill="${colors[i%4]}" opacity="0.25"/><path d="${up}" fill="none" stroke="${colors[i%4]}" stroke-width="2"/>`;});}
 else if(ch.type==='stacked_area'){let base=ch.series[0].points.map(p=>[p[0],vmin]);ch.series.forEach((se,i)=>{const top=se.points.map((p,j)=>[p[0],base[j][1]+p[1]]);const tp=linePath(top,x0,x1,y0,y1,vmin,vmax);const bp=linePath([...base].reverse(),x0,x1,y0,y1,vmin,vmax);s+=`<path d="${tp} ${bp.replace(/^M/,'L')} Z" fill="${colors[i%4]}" opacity="0.5"/>`;base=top;});}
 else{ch.series.forEach((se,i)=>{s+=`<path d="${linePath(se.points,x0,x1,y0,y1,vmin,vmax)}" fill="none" stroke="${colors[i%4]}" stroke-width="2.5"/>`;});}
 ch.series.forEach((se,i)=>{s+=`<text x="${x0+i*160}" y="18" font-size="13" fill="${colors[i%4]}">${esc(se.name)}</text>`;});
 return s+'</svg>';}
if(D.chart){document.getElementById('chartwrap').innerHTML='<h2>一生曲线</h2>'+renderChart(D.chart);}
</script>
</body></html>
