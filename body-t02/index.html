<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>性发育与生殖周期 (T02)</title>
<style>
  :root {
    --bg-page: #f8fafc;
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #64748b;
    --border-color: #cbd5e1;
    --border-light: #e2e8f0;
    --card-bg: #ffffff;
    --male-color: #0284c7;
    --female-color: #e11d48;
    --accent: #2563eb;
    --warning-bg: #fffbeb;
    --warning-border: #f59e0b;
    --success-bg: #f0fdf4;
    --success-border: #22c55e;
    --danger-bg: #fef2f2;
    --danger-border: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background-color: var(--bg-page);
    color: var(--text-primary);
    line-height: 1.6;
    padding: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }
  h1 { font-size: 1.8rem; margin-bottom: 8px; color: #0f172a; display: flex; align-items: center; gap: 10px; }
  .badge { background: #e0f2fe; color: #0369a1; padding: 3px 8px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; }
  .lead-p { color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 16px; background: #fff; padding: 14px; border-radius: 8px; border: 1px solid var(--border-light); }
  
  /* 普通流式布局控制台，禁止固定悬浮 */
  .control-panel {
    background: #ffffff;
    border: 2px solid var(--border-color);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 24px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.04);
  }
  .controls-row {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: center;
    margin-bottom: 14px;
  }
  .slider-group {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1 1 300px;
  }
  .slider-group label { font-weight: 700; white-space: nowrap; color: var(--text-primary); }
  input[type="range"] {
    flex-grow: 1;
    height: 8px;
    border-radius: 4px;
    background: #cbd5e1;
    outline: none;
    cursor: pointer;
  }
  .age-val-display {
    font-weight: 800;
    font-size: 1.2rem;
    color: var(--accent);
    min-width: 50px;
  }
  .gender-btns {
    display: flex;
    gap: 6px;
  }
  .btn {
    border: 1px solid var(--border-color);
    background: #f8fafc;
    color: var(--text-primary);
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
    transition: all 0.2s;
  }
  .btn:hover { background: #e2e8f0; }
  .btn.active {
    background: var(--text-primary);
    color: #fff;
    border-color: var(--text-primary);
  }
  
  .summary-strip {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    background: #f1f5f9;
    padding: 12px;
    border-radius: 8px;
    font-size: 0.9rem;
  }
  .summary-item strong { display: block; color: var(--text-muted); font-size: 0.78rem; text-transform: uppercase; margin-bottom: 2px; }
  .summary-item span { color: var(--text-primary); font-weight: 600; }

  /* 段落布局 */
  .section-block {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .section-title {
    font-size: 1.25rem;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #0f172a;
    border-bottom: 2px solid #f1f5f9;
    padding-bottom: 8px;
  }
  .section-title span { color: var(--accent); }

  /* SVG图表容器 */
  .chart-container {
    width: 100%;
    position: relative;
    background: #ffffff;
    border-radius: 8px;
    overflow: hidden;
  }
  svg { display: block; width: 100%; height: auto; }
  .chart-legend {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 10px;
    font-size: 0.9rem;
    font-weight: 600;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }

  /* 时间轴卡片 */
  .timeline-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .time-card {
    background: #f8fafc;
    border: 1px solid var(--border-light);
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: transform 0.15s, border-color 0.15s;
  }
  .time-card.current-stage {
    border: 2px solid var(--accent);
    background: #eff6ff;
  }
  .time-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px dashed var(--border-color);
    padding-bottom: 6px;
  }
  .stage-range { font-weight: 700; color: #1e293b; font-size: 1.05rem; }
  .stage-rev { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; background: #e2e8f0; color: #475569; }
  .card-p { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.45; }
  .card-tag { font-weight: 600; color: #0f172a; }

  /* 折叠专题 */
  details.branch-item {
    background: #f8fafc;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  summary.branch-header {
    padding: 12px 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border-bottom: 1px solid transparent;
    user-select: none;
  }
  details[open] summary.branch-header {
    border-bottom-color: var(--border-light);
    background: #f1f5f9;
  }
  .branch-tag {
    background: #e2e8f0;
    color: #334155;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .branch-body {
    padding: 14px 16px;
    font-size: 0.9rem;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  /* 干预窗口 */
  .window-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
  }
  .window-box {
    border-radius: 8px;
    padding: 16px;
    border: 1px solid transparent;
  }
  .win-locked { background: var(--danger-bg); border-color: var(--danger-border); }
  .win-high { background: var(--success-bg); border-color: var(--success-border); }
  .win-delay { background: var(--warning-bg); border-color: var(--warning-border); }
  .window-title { font-weight: 700; margin-bottom: 8px; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
  .win-locked .window-title { color: #991b1b; }
  .win-high .window-title { color: #166534; }
  .win-delay .window-title { color: #92400e; }
  .window-text { font-size: 0.88rem; line-height: 1.5; color: #1e293b; }

  /* 联动与核实清单 */
  .cross-links-box {
    background: #f8fafc;
    border-left: 4px solid var(--accent);
    padding: 14px 16px;
    border-radius: 4px;
    font-size: 0.92rem;
    line-height: 1.6;
    margin-bottom: 16px;
    color: #1e293b;
  }
  .claims-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
    margin-top: 10px;
  }
  .claims-table th, .claims-table td {
    border: 1px solid var(--border-light);
    padding: 8px 10px;
    text-align: left;
  }
  .claims-table th { background: #f1f5f9; color: var(--text-primary); font-weight: 600; }
  .claim-status {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 700;
  }
  .status-verified { background: #dcfce7; color: #15803d; }
  .status-corrected { background: #fef3c7; color: #b45309; }
</style>
</head>
<body>

  <h1>
    <span>性发育与生殖周期</span>
    <span class="badge">维度 T02</span>
  </h1>

  <p class="lead-p" id="curveNoteText"></p>

  <!-- 顶部控制台：普通流式布局，严格禁止 position fixed/sticky -->
  <div class="control-panel">
    <div class="controls-row">
      <div class="slider-group">
        <label for="ageRange">查阅年龄：</label>
        <input type="range" id="ageRange" min="0" max="95" value="25" step="1">
        <span class="age-val-display"><span id="ageVal">25</span> 岁</span>
      </div>
      <div class="gender-btns">
        <button class="btn active" data-view="both">男女对比</button>
        <button class="btn" data-view="male">仅看男性</button>
        <button class="btn" data-view="female">仅看女性</button>
      </div>
    </div>
    
    <!-- 摘要条：大白话 -->
    <div class="summary-strip">
      <div class="summary-item">
        <strong>当前人生阶段</strong>
        <span id="sumCurrentStage">--</span>
      </div>
      <div class="summary-item">
        <strong>下一个身体拐点</strong>
        <span id="sumNextInflection">--</span>
      </div>
      <div class="summary-item">
        <strong>当前核心关注点</strong>
        <span id="sumFocusPoint">--</span>
      </div>
    </div>
  </div>

  <!-- 正文A：轨迹图 -->
  <section class="section-block">
    <h2 class="section-title"><span>A</span> 全生命周期生殖活力与激素走势图</h2>
    <div class="chart-container">
      <svg id="svgChart" viewBox="0 0 900 380" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="chart-legend">
      <div class="legend-item" id="legendMale"><div class="legend-dot" style="background: var(--male-color);"></div>男性活力曲线（睾酮与精子活力）</div>
      <div class="legend-item" id="legendFemale"><div class="legend-dot" style="background: var(--female-color);"></div>女性活力曲线（卵泡储备与排卵活力）</div>
    </div>
  </section>

  <!-- 正文B：阶段时间轴卡片 -->
  <section class="section-block">
    <h2 class="section-title"><span>B</span> 生殖发育全阶段全景解析</h2>
    <div class="timeline-grid" id="timelineGrid"></div>
  </section>

  <!-- 正文C：可折叠专题 -->
  <section class="section-block">
    <h2 class="section-title"><span>C</span> 深入专题探讨</h2>
    <div id="branchesContainer"></div>
  </section>

  <!-- 正文D：干预窗口三类 -->
  <section class="section-block">
    <h2 class="section-title"><span>D</span> 关键干预与干预窗口（抓准时机）</h2>
    <div class="window-grid">
      <div class="window-box win-locked">
        <div class="window-title">⚠️ 错过就锁死（不可逆转）</div>
        <div class="window-text" id="winLockedText"></div>
      </div>
      <div class="window-box win-high">
        <div class="window-title">⭐ 黄金高回报（事半功倍）</div>
        <div class="window-text" id="winHighText"></div>
      </div>
      <div class="window-box win-delay">
        <div class="window-title">⏳ 仅能延缓（缓解退步）</div>
        <div class="window-text" id="winDelayText"></div>
      </div>
    </div>
  </section>

  <!-- 正文E：跨维度联动+可折叠核实清单 -->
  <section class="section-block">
    <h2 class="section-title"><span>E</span> 跨系统身体联动与科学事实核查</h2>
    <div class="cross-links-box" id="crossLinksText"></div>
    <details class="branch-item" style="background: #fff; margin-bottom: 0;">
      <summary class="branch-header">
        <span class="branch-tag">医学证据清单</span>
        <span>点击展开医学事实与证据来源列表（共 <span id="claimsCount">0</span> 条）</span>
      </summary>
      <div class="branch-body" style="padding: 10px; overflow-x: auto;">
        <table class="claims-table">
          <thead>
            <tr>
              <th style="width: 80px;">编号</th>
              <th style="width: 100px;">阶段</th>
              <th>科学断言 (通俗说明)</th>
              <th>生化参考值 / 医学指标</th>
              <th style="width: 90px;">状态</th>
              <th>证据出处</th>
            </tr>
          </thead>
          <tbody id="claimsTbody"></tbody>
        </table>
      </div>
    </details>
  </section>

<script>

  const rawData = {"dim": "T02", "title": "性发育与生殖周期", "curve_note": "这条曲线代表一个人一生中生殖系统活力和激素水平的变化，最高为100分。刚出生的男宝在半岁前会经历一次短暂的激素小爆发，叫迷你青春期，活力达到26分；女宝两岁前体内激素也会经常起伏。2到9岁时，大脑把生殖系统牢牢按住，进入全面休眠的低谷期，只有2到8分。10到19岁青春期踩下油门，各项指标飞速飙升。20到35岁迎来生育能力的黄金巅峰期，打满100分。女性在45到55岁时，因为卵巢里的卵泡基本掏空，生育能力像坐滑梯一样断崖式下跌，55岁绝经后降到7分左右。男性则从40岁起缓缓滑坡，体内产生睾酮（维持男性体态与精力的核心激素）的细胞慢慢减少，是一条平缓向下的长下坡，到了85岁以上只剩一点底色。", "ages": [0, 2, 5, 9, 12, 15, 19, 25, 35, 45, 55, 65, 75, 85, 95], "series": {"male": [26, 5, 2, 7, 32, 76, 95, 100, 89, 74, 58, 44, 30, 18, 9], "female": [18, 4, 2, 8, 46, 86, 98, 100, 78, 42, 7, 3, 2, 1, 0]}, "claims": [{"claim_id": "T02-C01", "statement": "宝宝离开妈妈肚子后，脱离了母体高浓度激素的压制，会经历一场迷你青春期。男宝在1到3个月大时睾酮水平达到小高峰，半岁前恢复平静；女宝体内的雌激素和促性腺激素波动则会断断续续维持到一两岁。", "value": "男婴总睾酮峰值达1-12 nmol/L（1-3月龄，6月龄前降至基线<0.5 nmol/L）；女婴FSH/E2高水平脉动持续12-24个月", "stage": "0-2岁婴儿期", "status": "[VERIFIED]", "source": "Kuiri-Hänninen et al., Endocr Rev, 2014; PMID: 28628972"}, {"claim_id": "T02-C02", "statement": "胎儿性别发育全看孕早期雄激素和退化管道信号的配合。怀胎第7周时，男胎启动机制让原本通往女性器官的管道退化萎缩；孕8到14周睾丸开始大量制造睾酮，长出男宝的外生殖器。", "value": "孕8-14周胎儿睾酮峰值达8-12 nmol/L，驱动中肾管分化及外生殖器男性化形成", "stage": "胎儿期", "status": "[VERIFIED]", "source": "Rey et al., Semin Reprod Med, 2012; Hughes et al., 2006"}, {"claim_id": "T02-C03", "statement": "孩子身上的肾上腺觉醒和生殖腺觉醒是两码事。6到8岁时，肾上腺先偷偷苏醒分泌弱雄激素，开始让孩子长出小体味和细毛；这比真正由大脑指挥的青春期性发育要早发生几年。", "value": "肾上腺初现发生于6-8岁（血清DHEA-S>1.0 μmol/L诱导阴毛/腋毛萌出与体味改变）；性腺初现发生于9-11岁（弓状核GnRH脉冲重新激活）", "stage": "3-9岁儿童期", "status": "[VERIFIED]", "source": "Auchus et al., 2004; PMID: 34250379"}, {"claim_id": "T02-C04", "statement": "判断青春期真正开始有硬标准：女孩以乳房摸到硬核小鼓包为准，男孩以两边睾丸明显变大、容量达到4毫升（大概有大枣大小）为准。", "value": "女童B2启动中位年龄为9.8-10.2岁；男童G2睾丸容积≥4 mL启动中位年龄为10.5-11.5岁", "stage": "10-19岁青春期", "status": "[VERIFIED]", "source": "PMID: 41921546; PMID: 12388944; PMID: 34250379"}, {"claim_id": "T02-C05", "statement": "女孩蹿个子最猛的一年必然发生在月经初潮之前。等第一次来月经时，蹿个子的势头已经放慢了，初潮主要是子宫内膜受体内雌激素（掌管女性发育与月经的激素）刺激后的脱落反应。", "value": "女性PHV中位年龄11.5-12.0岁（峰速8-9 cm/年），初潮中位年龄为12.5-12.8岁，初潮时间严格滞后PHV约0.8-1.5年", "stage": "10-19岁青春期", "status": "[VERIFIED]", "source": "Marshall & Tanner, Arch Dis Child, 1969; Biro et al., 2006"}, {"claim_id": "T02-C06", "statement": "男孩第一次遗精大多发生在大个子蹿得最快的那段时间，这时候变声也很明显，说明睾丸内部造精子的流水线已经彻底打通并开始运转。", "value": "首次遗精中位年龄为13.5-14.5岁，对应睾丸容积达10-15 mL及PHV峰速阶段（10-12 cm/年）", "stage": "10-19岁青春期", "status": "[VERIFIED]", "source": "Nielsen et al., 1986; Kulin et al., 1989"}, {"claim_id": "T02-C07", "statement": "女人一辈子的卵泡（孕育卵子的小摇篮）是只减不增的消耗品。在妈妈肚子里5个月时有700万个，出生时就只剩一两百万，青春期只剩几十万，37岁半之后更是像刹不住车一样加速凋零。", "value": "37.5岁卵泡临界数量约为25000个（闭锁速率加快约2倍），绝经时卵泡库耗竭跌破临界阈值<1000个", "stage": "20-55岁生殖期", "status": "[VERIFIED]", "source": "Faddy & Gosden, 1996; Wallace & Kelsey, PLoS ONE, 2010"}, {"claim_id": "T02-C08", "statement": "女性平均在51岁出头绝经。当月经停了一整年没再来，卵巢里储存的卵泡基本耗光，排卵彻底停止，标志着身体正式告别生育期。", "value": "绝经中位年龄51.4岁（95% CI: 45-55岁），血清FSH>25-40 IU/L伴AMH<0.01 ng/mL且闭经持续≥12个月为最终绝经（Stage 0）标志", "stage": "45-55岁中年过渡期", "status": "[VERIFIED]", "source": "STRAW+10 Collaborative Group, 2012; PMID: 41106025; PMID: 41156491"}, {"claim_id": "T02-C09", "statement": "男人过了三四十岁睾酮每年都在慢慢缩水，更糟糕的是，血液里把睾酮捆住的运输蛋白年年增加，导致真正能被身体自由使用的活性睾酮掉得更快。", "value": "TT年均下降0.8%-1.6%，SHBG年均上升1.2%-1.4%，具有生物活性的游离睾酮（FT）年均下降1.6%-2.2%", "stage": "36-75岁中老年期", "status": "[CORRECTED]", "source": "MMAS longitudinal study, Feldman et al., 2002; PMID: 27178254; PMID: 36038500"}, {"claim_id": "T02-C10", "statement": "诊断老年男性雄激素缺乏（男性更年期），不能只靠感觉没力气，必须结合早晨空腹抽血查出的睾酮硬指标来共同断定。", "value": "血清总睾酮<8.0-12.1 nmol/L（或计算游离睾酮cFT<220-240 pmol/L）为生化确认阈值", "stage": "56-75岁老年期", "status": "[VERIFIED]", "source": "Endocrine Society Clinical Practice Guideline, Bhasin et al., 2018; PMID: 17171213"}, {"claim_id": "T02-C11", "statement": "真性性早熟是大脑总指挥部提前拉响了警报，性激素提前大量释放，导致孩子过早发育、骨骼生长板提前闭合，最终个子反而长不高。", "value": "女童在8.0岁前出现Tanner B2（乳芽萌出），或男童在9.0岁前出现双侧睾丸增大（容积≥4 mL）", "stage": "3-9岁儿童期", "status": "[VERIFIED]", "source": "Carel et al., Pediatrics, 2009; 中华医学会儿科学分会内分泌学组CPP指南"}, {"claim_id": "T02-C12", "statement": "很多发育晚的孩子属于体质性发育延迟，俗称长得慢、晚长，骨龄往往落后好几年，但需要仔细检查，排除是不是身体天生缺少启动激素的器质性毛病。", "value": "女童满13岁无乳房发育或满15岁尚无初潮；男童满14岁双侧睾丸容积仍<4 mL（未达G2），伴骨龄落后2-3年", "stage": "10-19岁青春期", "status": "[VERIFIED]", "source": "Sedlmeyer & Palmert, Endocr Rev, 2002; Wei & Crowne, 2016"}, {"claim_id": "T02-C13", "statement": "怀孕早期胚胎分泌激素保住黄体继续供养胎儿；哺乳期频繁喂奶会产生大量的催乳素，就像在大脑里按下了刹车键，暂停排卵和月经，形成天然避孕效果。", "value": "hCG在孕8-10周达峰值（50000-100000 IU/L）；哺乳期血清PRL维持>50-100 ng/mL时下丘脑GnRH/LH脉冲被强力抑制阻断排卵", "stage": "20-35岁峰值期", "status": "[VERIFIED]", "source": "McNeilly, Hum Reprod Update, 2001; Knobil and Neill's Physiology of Reproduction, 2015"}], "stages": [{"range": "胎儿关键期", "mechanism": "宝宝在肚子里时，男胎依靠特殊基因把女性管道拆除，睾丸大量分泌睾酮让外生殖器长成男宝模样；女胎因为没有雄激素干扰，天然会长出子宫和输卵管。", "male": "孕2到3个月时睾酮飙出小高峰，孕晚期睾丸在激素指引下顺着通道乖乖掉进阴囊。", "female": "没有任何雄激素打扰，自发长成子宫与输卵管；孕5个月时体内的卵泡存量达到一辈子最多的700万，之后便开始不断自我消耗。", "reversibility": "身体底子定型，无法重来"}, {"range": "0-2岁", "mechanism": "脱离母体环境后，生殖系统短暂醒过来经历一场小演练，给身体器官打个烙印，随后大脑立刻踩下刹车，进入长达数年的大冬眠。", "male": "满月到3个月大时睾酮出现一波小峰值，帮助小丁丁和睾丸稍微长一点，半岁后彻底平息休眠。", "female": "出生后体内激素偶尔泛起微波，刺激卵巢里极小的卵泡冒头，持续一到两年后完全安静下来。", "reversibility": "短暂苏醒，随后自然平静"}, {"range": "3-9岁", "mechanism": "大脑牢牢锁死生殖系统的总开关。到了6到8岁，头顶的肾上腺先微微活动起来，和生殖腺各走各的路，各自独立。", "male": "睾丸一直保持只有两颗小花生米大的休眠状态；6岁后肾上腺激素冒头，开始冒出微弱体味和少量绒毛。", "female": "卵巢和子宫完全处于休眠状态；肾上腺激素轻微上升，带来微微体味和少许细毛，骨骼稳步生长。", "reversibility": "大脑程序设定好的深度休眠期"}, {"range": "10-19岁", "mechanism": "大脑总开关彻底松开刹车，像发报机一样有节奏地发射激素指令，唤醒性器官，促使身高疯狂蹿升，并最终闭合骨骼生长缝隙。", "male": "睾丸变大起步，个子猛蹿，接着变声、出现第一次遗精，最终睾丸全天候源源不断产生精子。", "female": "乳房先冒出小硬核，接着身高猛长，随后迎来月经初潮，慢慢建立起规律的排卵周期。", "reversibility": "身体走向成熟，定型不可逆"}, {"range": "20-35岁", "mechanism": "生殖调控体系运行最稳、配合最默契的阶段。精子和卵子的质量处于全生命周期的黄金顶峰，子宫环境也最适合胚胎扎根生长。", "male": "睾丸每天开足马力生产几千万个活力充沛的精子，保护屏障坚固，精子基因损坏率极低。", "female": "月经和排卵规律稳定，卵子质量最好、染色体出错概率很低，卵巢库存充盈，孕激素分泌充足。", "reversibility": "功能处于巅峰，调节弹性最强"}, {"range": "36-55岁", "mechanism": "男女在这里走向不同路口：女性的卵泡库存像快要见底的粮仓，37岁半后加倍耗损，绝经时几乎清空；男性制造睾酮的细胞每年都在凋落，搬运蛋白还越来越多，把能用的睾酮给锁住了。", "male": "造睾酮的细胞每年少1%，精子质量逐渐下降，能起效的自由睾酮年年下滑，精力与勃起硬度慢慢退步。", "female": "月经周期开始变得忽长忽短，时而停经两三个月，直到51岁左右彻底停经一年以上，卵巢彻底停止排卵。", "reversibility": "女性卵子耗尽无法再生，男性呈渐进式慢慢滑坡"}, {"range": "56-75岁", "mechanism": "女性绝经后身体几乎没有自己产的雌激素，失去了这层保护伞，骨头和血管开始迅速退化；男性体内游离的睾酮低过警戒线，体能滑坡、骨头变脆、小肚子变大。", "male": "睾丸组织内部结疤变硬，清晨睾酮经常不达标，肌肉变少萎缩，内脏长肥肉，容易疲劳甚至贫血。", "female": "雌激素降到底线，私密处干涩萎缩，骨骼里的钙质像漏斗一样加快流失，容易骨质疏松。", "reversibility": "生殖功能彻底枯竭，进入老化退行期"}, {"range": "76-95+岁", "mechanism": "生殖器官组织老化变硬，微血管大多闭合萎缩；大脑发出的激素指令也迟钝麻木了，整个生殖系统基本退化平息。", "male": "造睾酮的细胞所剩无几，活性雄激素极度匮乏，前列腺肥大结节压迫尿道，排尿越来越费劲。", "female": "卵巢完全缩成细条条的纤维硬块，生殖内分泌的各项活力基本归零。", "reversibility": "终身老化期，功能完全平息"}], "branches": [{"tag": "[分子机制深潜]", "title": "男性生殖轴发育、精子发生动力学与迟发性性腺功能减退（LOH）", "body": "在妈妈肚子里第7周，男胎独有的基因就像一把开关，命令原本男女不分的组织变成睾丸。睾丸造出抑制女胎管道的化学信号，同时借着胎盘激素刺激大量制造睾酮，把外边的小零件塑造成男宝样子。宝宝出生后一到三个月会有一场几周的激素演习，叫迷你青春期，随后完全睡下。到了十来岁青春期，大脑像钟摆一样有节奏地往下发指令，睾丸接单后开足马力合成睾酮，并打理出维持60多天精子生长周期的理想环境。40岁之后，睾丸里造睾酮的工人每年少1%，血管慢慢硬化供血不足；加上肝脏造出的运输蛋白像大锁一样把睾酮锁在血液里，真正能干活的游离睾酮每年缩水将近2%。当清晨抽血查出睾酮明显不够，同时伴随硬不起来、浑身没劲、将军肚猛长时，在医学上就正式确诊为男性更年期（迟发性性腺减退）。"}, {"tag": "[分子机制深潜]", "title": "女性卵泡储备衰竭动力学、Tanner分期演进与STRAW+10分期", "body": "女孩在妈妈肚子里5个月时，体内的卵泡库存有足足700万个，这是人生的顶峰；出生时缩水到一两百万，到了青春期只剩三四十万。青春期开启全靠大脑中枢松开刹车，下达发牌信号。女孩子的发育像走台阶：先是乳房出现硬块小芽（大概10岁左右），接着个头飞蹿，随后乳晕鼓起，最后迎来初潮（平均12岁半多）；刚来月经的前一两年往往只来血不排卵，最后才定型成熟。卵泡的消耗就像沙漏：37岁半之前每个月固定消耗几十到几百个备选卵泡；一旦到了37岁半，库存只剩大概两万五千个时，沙漏的速度突然翻倍变快。更年期时，月经周期先是相差一个星期以上，接着出现两三个月不来，血液里的排卵储备指标跌入谷底；直到最后整整一年不来月经，就宣告彻底绝经（平均51岁多），此时卵泡已经跌到不足一千个，身体彻底停止排卵。"}, {"tag": "[分子机制深潜]", "title": "妊娠与哺乳期母体生殖神经内分泌-代谢重塑网络", "body": "受精卵在子宫安家后，胚胎迅速分泌早孕激素保住黄体，继续供应保胎激素，直到两个多月后胎盘完全接班。胎盘就像一个临时的巨型内分泌工厂，大量生产各种孕期专属激素，不仅让大脑彻底停止每月的排卵排练，还故意让妈妈的身体对胰岛素稍有迟钝，以便把养分优先输送给宝宝。生完孩子胎盘脱离母体，孕期激素暴跌，压在脑子里的封印瞬间解开。宝宝吮吸乳房的信号顺着神经直通大脑，促使泌乳素像开闸放水一样涌出，同时催产素让乳腺管收紧往外喷奶。更巧妙的是，只要保持高强度的喂奶，泌乳素就会在脑子里紧紧捂住排卵启动器的嘴，让脑垂体根本发不出排卵信号，在全母乳喂养期间就形成了自然的停经避孕效果。"}, {"tag": "[分子机制深潜]", "title": "性发育时序偏离：中枢性性早熟（CPP）与体质性青春期延迟（CDGP）机制阈值", "body": "身体什么时候发育，全看基因指挥、营养存量和大脑内部开关的精密配合。真性性早熟是因为大脑的刹车踩得太早松开，提前发出性激素冲锋号，通过打针抽血测试可以确认。性早熟最大的隐患是性激素催着骨骼快速老熟，让骨龄比实际年龄大上两岁以上，生长缝隙过早彻底骨化关死，看似小时候蹿得高，长大后却成了矮个子。另一头是发育过迟，也就是平时说的晚长，多半随父母，大脑开工慢了半拍，骨龄和身高生长比同龄人慢上两三年，但身体的生长潜力其实完好无损。医生定下了警戒红线：女孩满13岁乳房完全没动静或满15岁没来月经、男孩满14岁睾丸还是豆粒大，就必须全面排查，分清到底是正常的晚长，还是大脑和垂体生了毛病发不出启动信号。"}], "windows": {"locked": "胎儿时期的生殖器官打底定型（怀孕第8到14周是男宝外生殖器长成的关键窗口，错过了就会变成隐睾或尿道下裂，出生后吃药打针也补不回来）；骨骼生长缝隙完全闭合（女孩骨龄到14到15岁、男孩骨龄到16到17岁，高水平雌激素让生长板彻底长死变成硬骨头，身高的物理大门永久锁死）；绝经后卵泡彻底耗光（剩余卵泡跌到1000个以下，卵巢再也生不出新的卵子，自然排卵和生育能力永久闭幕）。", "high_return": "婴儿期黄金纠偏窗（宝宝出生后半岁以内，是利用迷你青春期激素治疗睾丸未降或小丁丁的最好时机；隐睾手术最好在1岁到1岁半前做完，拖晚了会导致造精细胞永久坏死）；性早熟刹车窗口（女孩骨龄小于11岁半、男孩骨龄小于12岁半前，及时打针按下发育暂停键，挽回身高损失的效果最好）；黄金生育储备窗（女方在22到32岁卵巢存量足、卵子质量好；男方在20到35岁精子健康完整、活力最高）。", "delay_only": "围绝经期过渡期（45到50岁左右）：在停经10年之内且60岁以前，适当补充女性激素，可以很好地保护骨骼、防止骨质疏松、减轻忽冷忽热盗汗，但没法阻止卵泡库本身见底；男性更年期阶段（55到70岁）：外源补充睾酮能改善疲乏无力、掉肌肉、长肚子和勃起变差，但没法让睾丸内部老化变硬的组织重新焕发青春活力。"}, "cross_links": "生殖系统（T02）和全身多处紧密相连：首先与骨骼骨量（T05）牢牢捆绑，青春期雌激素飙升先帮着猛蹿个子、再彻底封死骨缝，而绝经后雌激素断崖下跌会让骨头加速溶解变脆；与体型胖瘦（T03）互为因果，雄激素负责帮男性长肌肉、硬骨骼，雌激素则指引女性把皮下脂肪存到胸部和臀腿部；与心脏血管（T06）息息相关，雌激素平时就像血管的软化保护伞，绝经后失去这层保护，女性得心血管病的概率短短几年内就会追平男性；与大脑神经（T11）直接挂钩，更年期体内雌激素剧烈上下颠簸，会直接打乱大脑里的体温恒温器，引发一阵阵发热出汗和情绪烦躁。"};

  // 图表参数

    // 关键定性趋势标注带（背景浅色块）

      zText.setAttribute('font-weight', 'bold');
      zText.textContent = z.label;
      svg.appendChild(zText);
    });

    // 路径生成
    function createPathD(data) {
      return data.map((val, idx) => {
        const x = xCoord(ages[idx]);
        const y = yCoord(val);
        return (idx === 0 ? 'M' : 'L') + x + ',' + y;
      }).join(' ');
    }

    // 绘制男性线
    if (currentGenderView === 'both' || currentGenderView === 'male') {
      const pathM = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      pathM.setAttribute('d', createPathD(maleData));
      pathM.setAttribute('fill', 'none');
      pathM.setAttribute('stroke', '#0284c7');
      pathM.setAttribute('stroke-width', '3');
      pathM.setAttribute('stroke-linecap', 'round');
      svg.appendChild(pathM);

      // 点与数值
      maleData.forEach((val, idx) => {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', xCoord(ages[idx]));
        circle.setAttribute('cy', yCoord(val));
        circle.setAttribute('r', '4');
        circle.setAttribute('fill', '#0284c7');
        svg.appendChild(circle);
      });
    }

    // 绘制女性线
    if (currentGenderView === 'both' || currentGenderView === 'female') {
      const pathF = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      pathF.setAttribute('d', createPathD(femaleData));
      pathF.setAttribute('fill', 'none');
      pathF.setAttribute('stroke', '#e11d48');
      pathF.setAttribute('stroke-width', '3');
      pathF.setAttribute('stroke-linecap', 'round');
      svg.appendChild(pathF);

      // 点与数值
      femaleData.forEach((val, idx) => {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', xCoord(ages[idx]));
        circle.setAttribute('cy', yCoord(val));
        circle.setAttribute('r', '4');
        circle.setAttribute('fill', '#e11d48');
        svg.appendChild(circle);
      });
    }

    // 游标竖线联动
    const curX = xCoord(currentSelectedAge);
    const vLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    vLine.setAttribute('x1', curX);
    vLine.setAttribute('y1', padT);
    vLine.setAttribute('x2', curX);
    vLine.setAttribute('y2', padT + plotH);
    vLine.setAttribute('stroke', '#334155');
    vLine.setAttribute('stroke-width', '2');
    vLine.setAttribute('stroke-dasharray', '4,4');
    svg.appendChild(vLine);

    // 联动游标点与实时气泡数值
    const maleCurVal = getInterpolatedVal(maleData, currentSelectedAge);
    const femaleCurVal = getInterpolatedVal(femaleData, currentSelectedAge);

    if (currentGenderView === 'both' || currentGenderView === 'male') {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', curX);
      c.setAttribute('cy', yCoord(maleCurVal));
      c.setAttribute('r', '6');
      c.setAttribute('fill', '#0284c7');
      c.setAttribute('stroke', '#fff');
      c.setAttribute('stroke-width', '2');
      svg.appendChild(c);

      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', curX + 8);
      t.setAttribute('y', yCoord(maleCurVal) - 6);
      t.setAttribute('font-size', '12');
      t.setAttribute('font-weight', 'bold');
      t.setAttribute('fill', '#0284c7');
      t.textContent = `男: ${maleCurVal}分`;
      svg.appendChild(t);
    }

    if (currentGenderView === 'both' || currentGenderView === 'female') {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', curX);
      c.setAttribute('cy', yCoord(femaleCurVal));
      c.setAttribute('r', '6');
      c.setAttribute('fill', '#e11d48');
      c.setAttribute('stroke', '#fff');
      c.setAttribute('stroke-width', '2');
      svg.appendChild(c);

      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', curX + 8);
      t.setAttribute('y', yCoord(femaleCurVal) + 16);
      t.setAttribute('font-size', '12');
      t.setAttribute('font-weight', 'bold');
      t.setAttribute('fill', '#e11d48');
      t.textContent = `女: ${femaleCurVal}分`;
      svg.appendChild(t);
    }
  }

  // 更新摘要条与时间轴联动卡片
  function updateSummary(age) {
    let stageName = '';
    let nextInflection = '';
    let focus = '';

    if (age <= 2) {
      stageName = '婴儿期（微型青春期）';
      nextInflection = '3岁进入生殖大冬眠休眠期';
      focus = '留意男宝隐睾或小丁丁，出生半岁内纠偏回报最高';
    } else if (age <= 9) {
      stageName = '儿童静止期（全面休眠）';
      nextInflection = '10岁青春期全面点火启动';
      focus = '防范性早熟（女8岁前萌胸、男9岁前大枣睾丸），避开骨缝早闭';
    } else if (age <= 19) {
      stageName = '青春突增期（身体大定型）';
      nextInflection = '20岁步入黄金繁育巅峰';
      focus = '蹿个子、月经初潮与初次遗精，关注骨龄增长速度';
    } else if (age <= 35) {
      stageName = '黄金繁育巅峰期';
      nextInflection = '37岁半女性卵泡凋亡加速临界点';
      focus = '卵子精子品质极佳、活力打满，适合优生优育储备';
    } else if (age <= 55) {
      stageName = '中年过渡期（男缓坡 / 女滑梯）';
      nextInflection = '51-55岁女性绝经、男性活性睾酮加速见底';
      focus = '女性关注经期紊乱与骨质保护，男性警惕腰围发福与精力滑坡';
    } else if (age <= 75) {
      stageName = '老年前期（生殖功能退化期）';
      nextInflection = '75岁身体多系统深度老化期';
      focus = '女性防范骨折心血管风险，男性监测清晨睾酮与前列腺通畅';
    } else {
      stageName = '高龄平息期（组织硬化休止）';
      nextInflection = '生命平稳维系';
      focus = '前列腺排尿健康，全身骨骼与代谢基底维稳';
    }

    document.getElementById('sumCurrentStage').textContent = stageName;
    document.getElementById('sumNextInflection').textContent = nextInflection;
    document.getElementById('sumFocusPoint').textContent = focus;

    // 高亮对应的时间轴卡片
    const cards = document.querySelectorAll('.time-card');
    cards.forEach(c => c.classList.remove('current-stage'));
    let matchRange = '';
    if (age <= 2) matchRange = '0-2岁';
    else if (age <= 9) matchRange = '3-9岁';
    else if (age <= 19) matchRange = '10-19岁';
    else if (age <= 35) matchRange = '20-35岁';
    else if (age <= 55) matchRange = '36-55岁';
    else if (age <= 75) matchRange = '56-75岁';
    else matchRange = '76-95+岁';

    cards.forEach(c => {
      if (c.dataset.range === matchRange) {
        c.classList.add('current-stage');
      }
    });
  }

  // 事件监听：年龄滑块
  const ageRange = document.getElementById('ageRange');
  const ageVal = document.getElementById('ageVal');
  ageRange.addEventListener('input', (e) => {
    currentSelectedAge = parseInt(e.target.value, 10);
    ageVal.textContent = currentSelectedAge;
    renderChart();
    updateSummary(currentSelectedAge);
  });

  // 事件监听：性别切换
  const btns = document.querySelectorAll('.gender-btns .btn');
  btns.forEach(b => {
    b.addEventListener('click', () => {
      btns.forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      currentGenderView = b.dataset.view;

      // 同步图例透明度
      const legM = document.getElementById('legendMale');
      const legF = document.getElementById('legendFemale');
      if (currentGenderView === 'both') {
        legM.style.opacity = '1';
        legF.style.opacity = '1';
      } else if (currentGenderView === 'male') {
        legM.style.opacity = '1';
        legF.style.opacity = '0.3';
      } else {
        legM.style.opacity = '0.3';
        legF.style.opacity = '1';
      }

      renderChart();
    });
  });

  // 初始化
  renderChart();
  updateSummary(currentSelectedAge);
</script>
</body>
</html>
