<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>📈 好习惯发现器</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --line:#e4e7ec; --line-2:#eef0f3;
    --tx:#1c2024; --tx-2:#4a5158; --tx-3:#8b939c;
    --accent:#17795c; --accent-soft:#e8f4ef;
    --new:#b45309; --new-soft:#fdf3e3;
    --upd:#1d4ed8; --upd-soft:#e8eefc;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 14px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--tx);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}

  header.top{
    background:linear-gradient(180deg,#fff 0%,#fbfcfd 100%);
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:30;
  }
  .top-inner{padding:18px 0 0}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .brand h1{margin:0;font-size:20px;letter-spacing:.2px}
  .brand .sub{color:var(--tx-3);font-size:13px}
  .statline{display:flex;gap:22px;flex-wrap:wrap;margin:10px 0 14px;font-size:13px;color:var(--tx-2)}
  .statline b{color:var(--tx);font-size:16px;font-weight:650;margin-right:4px}
  .statline i{font-style:normal;color:var(--tx-3)}

  .toolbar{display:flex;gap:10px;align-items:center;padding-bottom:12px;flex-wrap:wrap}
  .search{flex:1 1 260px;position:relative;min-width:220px}
  .search input{
    width:100%;padding:10px 34px 10px 13px;border:1px solid var(--line);border-radius:9px;
    background:#fff;font-size:14px;color:var(--tx);outline:none;
  }
  .search input:focus{border-color:#b9d9cc;box-shadow:0 0 0 3px var(--accent-soft)}
  .search .clear{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    border:0;background:transparent;color:var(--tx-3);cursor:pointer;font-size:16px;padding:4px 7px;border-radius:6px;display:none
  }
  .search.has .clear{display:block}
  .search .clear:hover{background:var(--line-2);color:var(--tx)}

  nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
  nav.tabs button{
    border:1px solid transparent;background:transparent;color:var(--tx-2);
    padding:7px 13px;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit
  }
  nav.tabs button:hover{background:var(--line-2);color:var(--tx)}
  nav.tabs button.on{background:var(--accent-soft);color:var(--accent);border-color:#cfe7de;font-weight:600}

  .catbar{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding:0 0 13px;
    scrollbar-width:none;-ms-overflow-style:none}
  .catbar::-webkit-scrollbar{display:none}
  .catbar button{
    border:1px solid var(--line);background:#fff;color:var(--tx-2);flex:0 0 auto;
    padding:4px 10px;border-radius:999px;font-size:12.5px;cursor:pointer;font-family:inherit
  }
  .catbar button:hover{border-color:#cdd3da}
  .catbar button.on{background:var(--tx);color:#fff;border-color:var(--tx)}

  main{padding:22px 0 60px}
  .group-title{
    display:flex;align-items:center;gap:10px;margin:26px 0 12px;
    font-size:14px;font-weight:650;color:var(--tx)
  }
  .group-title:first-child{margin-top:4px}
  .group-title .n{color:var(--tx-3);font-weight:400;font-size:13px}
  .group-title .rule{flex:1;height:1px;background:var(--line)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(342px,1fr));gap:14px;align-items:start}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:15px 16px 13px;box-shadow:var(--shadow);display:flex;flex-direction:column;
    transition:border-color .15s,transform .15s
  }
  .card:hover{border-color:#d3d9e0;transform:translateY(-1px)}
  .card-head{display:flex;align-items:flex-start;gap:9px;margin-bottom:6px}
  .card-head h3{margin:0;font-size:15.5px;line-height:1.45;font-weight:650;flex:1}
  .badge{
    flex:0 0 auto;font-size:11.5px;padding:2px 7px;border-radius:6px;font-weight:600;
    white-space:nowrap;margin-top:2px
  }
  .badge.new{background:var(--new-soft);color:var(--new)}
  .badge.upd{background:var(--upd-soft);color:var(--upd)}
  .desc{margin:0 0 10px;color:var(--tx-2);font-size:13.5px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
  .chip{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--line-2);color:var(--tx-2);white-space:nowrap}
  .chip.cat{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .chip.niche{background:#f2ecfb;color:#6b3fb5;font-weight:600}
  .chip.core{background:#eaf1f8;color:#2b5c8a;font-weight:600}
  .why{margin:0 0 10px;color:var(--tx-3);font-size:12.5px;line-height:1.6}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
  .tag{font-size:11.5px;color:var(--tx-3)}
  .srcs{border-top:1px solid var(--line-2);padding-top:9px;margin-top:auto}
  .srcs .h{font-size:11.5px;color:var(--tx-3);margin-bottom:5px}
  .srcs ol{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px}
  .srcs li{font-size:12.5px;line-height:1.5;display:flex;gap:6px}
  .srcs li .idx{color:#c2c8cf;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .srcs a{color:var(--tx-2);text-decoration:none;border-bottom:1px solid transparent}
  .srcs a:hover{color:var(--accent);border-bottom-color:#bcdccf}
  .srcs .plat{color:var(--accent);font-weight:500}
  .srcs .ti{color:var(--tx-3)}

  .panel{
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;
    box-shadow:var(--shadow);margin-bottom:18px
  }
  .panel h2{margin:0 0 10px;font-size:14px;font-weight:650}
  .panel ol,.panel ul{margin:0;padding-left:20px;color:var(--tx-2);font-size:13.5px}
  .panel li{margin:4px 0}
  .panel .hint{color:var(--tx-3);font-size:12.5px;margin:8px 0 0}

  .fold{
    background:#fff;border:1px solid var(--line);border-radius:10px;
    margin:26px 0 0;box-shadow:none
  }
  .fold>summary{
    cursor:pointer;list-style:none;padding:11px 14px;display:flex;align-items:center;gap:9px;
    font-size:13px;color:var(--tx-2);border-radius:10px
  }
  .fold>summary::-webkit-details-marker{display:none}
  .fold>summary:hover{background:var(--line-2)}
  .fold>summary .t{font-weight:600;color:var(--tx)}
  .fold>summary .n{color:var(--tx-3);font-size:12.5px}
  .fold>summary .caret{margin-left:auto;color:var(--tx-3);transition:transform .18s}
  .fold[open]>summary .caret{transform:rotate(90deg)}
  .fold[open]>summary{border-bottom:1px solid var(--line-2);border-radius:10px 10px 0 0}
  .fold .body{padding:12px 16px 15px}
  .fold .body h4{margin:0 0 6px;font-size:12.5px;color:var(--tx-3);font-weight:600}
  .fold .body ol,.fold .body ul{margin:0 0 12px;padding-left:20px;color:var(--tx-2);font-size:13px}
  .fold .body li{margin:4px 0}
  .fold .body ul{margin-bottom:0}

  .more{display:flex;justify-content:center;margin:12px 0 0}
  .more button{
    border:1px solid var(--line);background:#fff;color:var(--tx-2);cursor:pointer;
    padding:8px 16px;border-radius:999px;font-size:13px;font-family:inherit
  }
  .more button:hover{border-color:#cdd3da;color:var(--tx);background:var(--line-2)}

  .srcs li.isnew .idx{color:var(--new);font-weight:700}
  .srcs li.isnew a{color:var(--tx)}

  .empty{color:var(--tx-3);font-size:14px;padding:34px 0;text-align:center}
  footer{border-top:1px solid var(--line);background:#fff;padding:18px 0 30px;color:var(--tx-3);font-size:12.5px}
  footer .wrap{display:flex;flex-direction:column;gap:6px}
  footer b{color:var(--tx-2)}
  @media(max-width:640px){
    .grid{grid-template-columns:1fr}
    .statline{gap:14px}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-inner">
    <div class="brand">
      <h1>好习惯发现器</h1>
      <span class="sub" id="subline"></span>
    </div>
    <div class="statline" id="statline"></div>
    <div class="toolbar">
      <div class="search" id="searchBox">
        <input id="q" type="search" placeholder="搜索习惯名称、描述或标签…" autocomplete="off">
        <button class="clear" id="clearQ" title="清空">×</button>
      </div>
      <nav class="tabs" id="tabs">
        <button data-view="latest" class="on">最新发现</button>
        <button data-view="core">大众习惯</button>
        <button data-view="niche">小众发现</button>
        <button data-view="category">分类</button>
      </nav>
    </div>
    <div class="catbar" id="catbar"></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<footer>
  <div class="wrap">
    <div><b>关于发现强度</b>：单个发现 = 单一来源；少量重复 = 同语言 ≥2 个独立来源；多来源 = 中英文跨语种或 ≥3 个来源；高讨论度 = 来源明确报告高互动量。</div>
    <div><b>重要</b>：发现强度只是“多少人提到过”的信号，<b>不等于该习惯有效</b>。本页只做发现与归档，不解释机制、不评估证据、不提供健康建议。</div>
    <div id="footline"></div>
  </div>
</footer>

<script>
(function(){

  var view = 'latest', cat = 'all', q = '';

  document.getElementById('subline').textContent =

  var stat = [
    ['库内总量', S.total, '条'],
    ['大众', S.core, '条'],
    ['小众', S.niche, '条'],
    ['累计来源', S.sources, '条'],
    ['本轮新增', L.new_ids.length, '条'],
    ['本轮更新', L.updated_ids.length, '条']
  ];
  document.getElementById('statline').innerHTML = stat.map(function(s){
    return '<span><b>'+s[1]+'</b><i>'+s[2]+' · '+s[0]+'</i></span>';
  }).join('');

  document.getElementById('catbar').innerHTML =
    '<button data-cat="all" class="on">全部分类</button>' +
    P.categories.map(function(c){
      return '<button data-cat="'+c+'">'+c+' <span style="opacity:.55">'+S.by_category[c]+'</span></button>';
    }).join('');

  document.getElementById('footline').innerHTML =

    P.runs.map(function(r){return r.run_id;}).join(' / ');

  function esc(s){ return String(s||'').replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function card(h){
    var badge = '';
    if (h.status === 'new') badge = '<span class="badge new">新增</span>';
    else if (h.status === 'updated') badge = '<span class="badge upd">更新</span>';

    var stageCls = h.stage === 'niche' ? 'niche' : 'core';
    // “本轮 +N” 只对更新条目有意义：全新条目的来源本来就都是本轮的
    var freshN = h.status === 'updated'
      ? h.sources.filter(function(s){ return NEWU[s.url]; }).length : 0;
    var chips = '<span class="chip cat">' + esc(h.category) + '</span>' +
                '<span class="chip ' + stageCls + '">' + esc(h.stage_label) + '</span>' +
                '<span class="chip">' + esc(h.level_label) + '</span>' +
                '<span class="chip">来源 ' + h.source_count + '</span>' +
                (freshN ? '<span class="chip" style="background:var(--new-soft);color:var(--new)">本轮 +' + freshN + '</span>' : '');

    var srcs = h.sources.map(function(s,i){
      var isNew = freshN && NEWU[s.url];
      var nu = isNew ? ' class="isnew" title="本轮新增来源"' : '';
      var mk = isNew ? '＋ ' : '';
      return '<li'+nu+'><span class="idx">'+(i+1)+'</span><a href="'+esc(s.url)+'" target="_blank" rel="noopener">' +

    }).join('');

    return '<article class="card">' +
      '<div class="card-head"><h3>'+esc(h.name)+'</h3>'+badge+'</div>' +
      '<p class="desc">'+esc(h.description)+'</p>' +
      '<div class="chips">'+chips+'</div>' +
      '<p class="why">'+esc(h.why_notable)+'</p>' +
      '<div class="tags">'+h.tags.map(function(t){return '<span class="tag">#'+esc(t)+'</span>';}).join('')+'</div>' +
      '<div class="srcs"><div class="h">来源</div><ol>'+srcs+'</ol></div>' +
      '</article>';
  }

  function matches(h){
    if (cat !== 'all' && h.category !== cat) return false;
    if (!q) return true;
    var hay = (h.name + ' ' + h.description + ' ' + h.why_notable + ' ' +
               h.tags.join(' ') + ' ' + h.category + ' ' +
               h.sources.map(function(s){return s.platform + ' ' + s.title;}).join(' ')).toLowerCase();
    return q.toLowerCase().split(/\s+/).filter(Boolean).every(function(k){ return hay.indexOf(k) >= 0; });
  }

  // 每个分组先渲染前 PAGE 条，其余按需展开（400+ 条时避免一次性铺满 DOM）
  var PAGE = 48, EXPANDED = {};

  function group(title, list, note){
    if (!list.length) return '';
    var shown = EXPANDED[title] ? list.length : Math.min(PAGE, list.length);
    var html = '<div class="group-title"><span>'+title+'</span><span class="n">'+list.length+' 条'+(note||'')+'</span><span class="rule"></span></div>' +
               '<div class="grid">'+list.slice(0, shown).map(card).join('')+'</div>';
    if (shown < list.length) {
      html += '<div class="more"><button data-more="'+esc(title)+'">展开剩余 ' +
              (list.length - shown) + ' 条（共 ' + list.length + ' 条）</button></div>';
    }
    return html;
  }

  // 本轮趋势：折叠提示，默认收起，放在列表末尾而不是开头
  function fold(){
    var tr = L.trends || [], nx = L.next_directions || [];
    if (!tr.length && !nx.length) return '';
    return '<details class="fold">' +
      '<summary><span class="t">第 ' + L.run_no + ' 轮发现趋势</span>' +
      '<span class="n">' + tr.length + ' 条趋势 · ' + nx.length + ' 条下轮方向 · 点击展开</span>' +
      '<span class="caret">›</span></summary>' +
      '<div class="body">' +
        (tr.length ? '<h4>本轮发现趋势</h4><ol>' + tr.map(function(t){return '<li>'+esc(t)+'</li>';}).join('') + '</ol>' : '') +
        (nx.length ? '<h4>下一轮搜索方向（从已发现习惯向相邻行为扩展）</h4><ul>' +
                     nx.map(function(t){return '<li>'+esc(t)+'</li>';}).join('') + '</ul>' : '') +
      '</div></details>';
  }

  function render(){
    var out = '';
    var pool = H.filter(matches);

    if (q) {
      out += group('搜索结果', pool, q ? ' · “'+esc(q)+'”' : '');
      document.getElementById('main').innerHTML = out || '<div class="empty">没有匹配的习惯。</div>';
      return;
    }

    if (view === 'latest') {
      var nw = L.new_ids.map(function(i){return byId[i];}).filter(Boolean).filter(matches);
      var up = L.updated_ids.map(function(i){return byId[i];}).filter(Boolean).filter(matches);
      out += group('本轮新增', nw);
      out += group('本轮更新（新增来源 / 新实践变体）', up);
      if (!nw.length && !up.length) out += '<div class="empty">本轮暂无新增或更新。</div>';
      out += fold();
    }
    else if (view === 'core') {
      out += group('大众习惯 · 主流、长期存在、不同来源反复出现',
                   pool.filter(function(h){ return h.stage === 'core'; }));
    }
    else if (view === 'niche') {
      out += group('小众发现 · 低知名度但有人真实实践',
                   pool.filter(function(h){ return h.stage === 'niche'; }));
    }
    else {
      P.categories.forEach(function(c){
        var list = pool.filter(function(h){return h.category === c;});
        out += group(c, list);
      });
    }
    document.getElementById('main').innerHTML = out || '<div class="empty">该筛选下暂无条目。</div>';
  }

  function setView(v, push){
    view = v;
    [].forEach.call(document.getElementById('tabs').children, function(x){
      x.classList.toggle('on', x.dataset.view === v);
    });
    if (push && location.hash !== '#' + v) {
      try { history.replaceState(null, '', '#' + v); } catch(e) { location.hash = v; }
    }
    render();
  }

  document.getElementById('tabs').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    setView(b.dataset.view, true);
    window.scrollTo({top:0, behavior:'smooth'});
  });

  document.getElementById('catbar').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    cat = b.dataset.cat;
    [].forEach.call(this.children, function(x){ x.classList.toggle('on', x === b); });
    render();
  });

  document.getElementById('main').addEventListener('click', function(e){
    var b = e.target.closest('button[data-more]'); if (!b) return;
    EXPANDED[b.dataset.more] = true;
    render();
  });

  var qi = document.getElementById('q'), box = document.getElementById('searchBox');
  qi.addEventListener('input', function(){
    q = qi.value.trim();
    box.classList.toggle('has', !!q);
    render();
  });
  document.getElementById('clearQ').addEventListener('click', function(){
    qi.value=''; q=''; box.classList.remove('has'); render(); qi.focus();
  });

  // 支持 URL 锚点直达：#latest / #core / #niche / #category
  var initial = (location.hash || '').replace('#','');
  if (['latest','core','niche','category'].indexOf(initial) >= 0) view = initial;
  [].forEach.call(document.getElementById('tabs').children, function(x){
    x.classList.toggle('on', x.dataset.view === view);
  });

  render();
})();
</script>
</body>
</html>
