<!DOCTYPE html>
<html lang="zh"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><title>静态镜像链路测试页</title><style id="zgate-hide">body>*:not(#zgate){display:none!important}</style>
<style>
#zgate{position:fixed;inset:0;background:#f5f6f8;z-index:99999;display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#1c2333}
#zgate .zc{background:#fff;border-radius:14px;padding:22px 20px;max-width:400px;width:100%;box-shadow:0 2px 10px rgba(16,24,40,.08)}
#zgate h1{font-size:18px;margin:0 0 8px}
#zgate p{font-size:13px;color:#68707f;line-height:1.6;margin:0 0 14px}
#zgate form{display:flex;gap:8px}
#zgate input{flex:1;font-size:17px;padding:11px 12px;border:1px solid #d4d9e1;border-radius:10px;letter-spacing:.15em;min-width:0}
#zgate button{font-size:15px;padding:11px 16px;border:0;border-radius:10px;background:#1c2333;color:#fff}
#zgate .err{color:#c0392b;font-size:13px;min-height:18px;margin-top:10px}
#zgate .tag{display:inline-block;font-size:11px;color:#68707f;border:1px solid #d4d9e1;border-radius:20px;padding:2px 9px;margin-bottom:12px}
</style>
</head>
<body>
<div id="zgate">
  <div class="zc">
    <span class="tag">分类验证 · 档二</span>
    <h1>此页需要验证</h1>
    <p>输入统一码进入。本会话内只需输一次；关掉浏览器标签后，下次打开会再问。</p>
    <form id="zgate-form"><input id="zgate-input" inputmode="numeric" autocomplete="off" placeholder="输入统一码"><button type="submit">进入</button></form>
    <div class="err" id="zgate-err"></div>
<h1>链路测试页</h1><p>用于验证 static_mirror_sync 全链，验收后删除。</p><script>
(function(){
  var HASH = "520b619703d396230ca6fa57c511d9fd11c1ad618ed9d06f41bfa8e984a62514";
  var KEY = "zin7_gate_ok";
  function unlock(){
    var g = document.getElementById('zgate'); if (g) g.remove();
    var s = document.getElementById('zgate-hide'); if (s) s.remove();
  }
  try { if (sessionStorage.getItem(KEY) === '1') { unlock(); return; } } catch (e) {}
  var form = document.getElementById('zgate-form');
  var input = document.getElementById('zgate-input');
  var err = document.getElementById('zgate-err');
  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    var v = (input.value || '').trim();
    if (!v) { err.textContent = '先输入统一码'; return; }
    crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)).then(function(buf){
      var hex = Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0' + b.toString(16)).slice(-2); }).join('');
      if (hex === HASH) {
        try { sessionStorage.setItem(KEY, '1'); } catch (e) {}
        unlock();
      } else {
        err.textContent = '码不对，再试一次';
        input.value = '';
        input.focus();
      }
    });
  });
  input.focus();
})();
</script>
</body></html>
