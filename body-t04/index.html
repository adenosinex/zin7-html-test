<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大脑结构发育</title><style>
:root{--bg:#f7f2e9;--ink:#2b2620;--mut:#7a7264;--acc:#b4552d;--card:#fffdf8;--line:#e3dac8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC",serif;line-height:1.75}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 60px}
.kicker{color:var(--acc);letter-spacing:.2em;font-size:12px}
h1{font-size:30px;margin:6px 0 4px}.sub{color:var(--mut);margin:0 0 6px}
.modelnote{color:var(--mut);font-size:13px;border-bottom:1px solid var(--line);padding-bottom:14px}
h2{font-size:20px;margin:34px 0 10px;border-left:4px solid var(--acc);padding-left:10px}
.stage{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0}
.age{color:var(--acc);font-weight:700;font-size:14px}.stage h3{margin:2px 0 6px;font-size:17px}
.normal{color:#3d6b35;font-size:14px}.warn{color:#9a3b1e;font-size:14px}
table{width:100%;border-collapse:collapse;background:var(--card);font-size:14px}
td,th{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#f1e9d8}
.insight{background:#f3ead9;border-radius:10px;padding:16px}
.node{cursor:pointer}.node circle{fill:var(--acc)}.node text{fill:#fff;font-size:13px;font-weight:700}
#mechdesc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-height:56px}
details{margin-top:18px}summary{cursor:pointer;color:var(--acc)}
svg{max-width:100%;height:auto}
</style></head>
<body><div class="wrap">
<div class="kicker">人体全生命周期图谱 · T04</div>

<p class="modelnote">内容模型：Vertex Gemini 3.8 Flash（生成与整理）；关键数值经 PubMed 核查锁定。本页由确定性模板渲染。</p>
<div id="chartwrap"></div>

<details><summary>证据清单（数值来源）</summary><table><tr><th>编号</th><th>结论</th><th>核查</th><th>来源</th></tr><tbody id="claims"></tbody></table></details>
</div>
<script id="dimension-data" type="application/json">{"dim": "T04", "title": "大脑结构发育", "subtitle": "从神经元过剩生产到髓鞘化完成：大脑的四十年施工期", "model_note": "内容模型：Vertex Gemini 3.8 Flash（生成与整理）；关键数值经 PubMed 核查锁定。本页由确定性模板渲染。", "stages": [{"age": "0-2岁", "title": "0-2岁", "what": "婴儿大脑在1岁时脑容量就长到了成人的七成多（70%-75%），2岁时超过八成（80%-85%）；大脑表层厚度在1.7到2.1岁就已冲上一生最厚顶峰，脑内积水空腔在2.3岁被挤压到最小。看似才刚开始认人说话，其实8到12个月时神经接头的密集程度已是成人的1.5倍，大脑一生中最迅猛的个头疯长期在学会走路时就已收尾。"}, {"age": "2-6岁", "title": "2-6岁", "what": "3.5到5岁负责理性规划的前额区域神经接头刚迎来暴增，整个大脑表层负责思考的灰质总体积就在约5.9岁时冲到一生最高点。外表看孩子才刚开窍上幼儿园，大脑却已经开始不可逆地“修剪枝条”，思考区域体积从此一路单向缩减——后天的变聪明不再靠增加脑细胞，而靠淘汰用不上的废线路。"}, {"age": "6-25岁", "title": "6-25岁", "what": "管感官听看的区域在11岁前就已彻底修剪定型，但管自控、理智与长远规划的最高决策区域，其神经修剪要一路拉扯到22到25岁才完工。青春期的冲动、情绪失控，并不是脑子发育慢，而是最高决策系统在完成最终精简重组前必经的“施工阵痛”。"}, {"age": "25-40岁", "title": "25-40岁", "what": "常人以为心智在成年后就定型，但大脑深层负责传递信息的光缆网络（白质总体积）在约28.7岁才达到峰值；连接左右脑协同工作的高速干线在26到32岁时传输效率最高；脑前端精密线路外的“绝缘保护套”甚至会持续修补加固到35至42岁。成年早期的沉稳与通透，来自信息线路长达十几年的终极包裹连接。"}, {"age": "40-60岁", "title": "40-60岁", "what": "身体尚处壮年，整个大脑体积却从40岁起悄悄以每年缩水0.4%到0.5%的节奏变小，相当于每过十年萎缩掉小半成（约4%-5%）。深层通信线路开始老化磨损，这种静悄悄的萎缩通常要在十到二十年后，才会演变成日常频发的提笔忘字。"}, {"age": "60岁及以上", "title": "60岁及以上", "what": "负责记事的记忆中枢（海马体）以每年0.8%到1.2%的速度加速萎缩（相当于十年缩掉整整一成），脑内原本狭窄的腔室以每年1.8%到2.5%的复合速度反向变大；70岁后全脑体积每年缩水更突破1.0%（十年缩掉一成以上）。晚年出现的反应迟钝和老忘事，是大脑实质组织退缩、内部空腔被迫扩大长达二十年后的最终结果。"}], "redflags": [{"signal": "记忆力断崖式恶化（远超自然衰老速度）", "action": "60岁后若记忆下降速度达到正常衰老的2至5倍（例如半年到1年内，从偶尔忘事迅速恶化为反复询问同一件事、转头就忘，或在住了几十年的熟悉小区迷路、认不出熟人），这是脑神经病理性退化信号，绝非普通“老糊涂”，需立即去记忆门诊排查。"}, {"signal": "步态不稳伴随排尿失控（脑内空腔异常扩大）", "action": "60岁后若在几个月内突然出现走路迈不开步、双脚像吸在地上一样拖着走、极易频繁跌倒，同时伴随憋不住尿甚至尿失禁、思维反应迟钝，提示脑室异常膨胀积水，需紧急就医排查脑部积水压迫。"}, {"signal": "产后数年出现生活机能全面崩溃", "action": "女性在产后2到6年内出现注意力略微分散属于正常母职神经适应；但如果在此期间出现与带娃疲惫无关的全面记忆崩溃、生活完全无法自理、情绪极度麻木或认知混乱，提示可能存在非正常的脑神经损伤，不可单纯当作产后抑郁拖延。"}], "levers": [{"name": "守住深度睡眠，启动大脑夜间清洗", "effect": "动作：保证规律作息与深睡时长（睡前不饮酒、不看刺眼屏幕）。为什么有用：深睡期脑细胞间隙变大，脑内液体像洗车水枪一样强力冲刷排走白天积聚的有害代谢废物，阻止神经毒性垃圾堆积。多久见效：需以年为单位长期坚持，才能稳定减慢脑皮层萎缩速度。", "note": ""}, {"name": "尽早矫正听力，阻断大脑用脑过度透支", "effect": "动作：一旦发现听不清电视或常听漏对话，尽早配戴助听设备。为什么有用：听 不清会逼迫负责思考的脑区超负荷帮耳朵“猜词”，同时听觉脑区因缺乏刺激而废用萎缩；戴助听器能给大脑减负、维持信号刺激。多久见效：坚持使用数年后，能明显降低认知功能被透支加速恶化的风险。", "note": ""}, {"name": "规律有氧运动，硬抗记忆中枢自然缩水", "effect": "动作：每周进行3到5次中高强度的快走、慢跑、骑车或游泳。为什么有用：运动能直接刺激脑内分泌神经营养物质，刺激60岁后萎缩最严重的记忆中枢生成新的神经元。多久见效：必须持续坚持数月以上，才能真正对冲记忆区域每年约百分之一（0.8%-1.2%）的自然缩水。", "note": ""}], "insight": "变聪明从来不是拼命往大脑里塞进更多神经细胞，而是一场终生的“精准减法”——从童年大刀阔斧斩断低效废弃线路，到母亲产后为专注育儿主动精简部分脑区，大脑的主动退让与修剪，恰恰是心智走向成熟高效必须付出的物理代价。", "mechanism": {"nodes": [], "note": "图谱以思考区域（灰质）不可逆精简、通信光缆（白质绝缘层）跨数十年加固封顶、晚年大脑实质退缩导致内部空腔代偿性膨胀为主线，直观呈现大脑从童年“爆发修剪”走向晚年“静默空腔化”的全生命周期物理形变。"}, "claims": [{"id": "T04-C01", "claim": "皮层厚度达峰年龄极早，呈现倒U型变化轨迹，生后早期即完成最迅猛的皮层扩张与折叠。", "verdict": "VERIFIED", "source": "Bethlehem et al., 2022, Nature, PMID: 35388223"}, {"id": "T04-C02", "claim": "全脑皮质灰质总体积在儿童中期达到全生命周期峰值，随后因生理性突触修剪呈现不可逆单调下降。", "verdict": "VERIFIED", "source": "Bethlehem et al., 2022, Nature, PMID: 35388223"}, {"id": "T04-C03", "claim": "全脑白质总体积及深部投射传导束髓鞘成熟达峰年龄显著晚于灰质，支撑高级认知整合能力。", "verdict": "VERIFIED", "source": "Bethlehem et al., 2022, Nature, PMID: 35388223"}, {"id": "T04-C04", "claim": "侧脑室体积在童年早期达到相对容积最低点，60岁后呈指数级加速膨胀，成为脑实质萎缩的核心替代指标。", "verdict": "VERIFIED", "source": "Bethlehem et al., 2022, Nature, PMID: 35388223; Jack et al., 2005, Neurology, PMID: 16186523"}, {"id": "T04-C05", "claim": "初级视觉与感觉皮层突触密度呈爆发性过量生成，生后数月达到成人的150%，其后迅速修剪稳定。", "verdict": "VERIFIED", "source": "Huttenlocher & de Courten, 1987, Neuropsychologia, PMID: 3670652; Bourgeois & Rakic, 1993, J Neurosci, PMID: 8426229"}, {"id": "T04-C06", "claim": "背外侧前额叶皮层（dlPFC）的突触过度生成达峰较晚，突触修剪过程横跨整个青春期直至青年初期。", "verdict": "VERIFIED", "source": "Petanjek et al., 2011, PNAS, PMID: 21788513; Huttenlocher, 1979, Brain Res, PMID: 447471"}, {"id": "T04-C07", "claim": "前额叶联合皮层内轴突内侧微细髓鞘化及少突胶质细胞增殖可持续延长至成年后数十年。", "verdict": "VERIFIED", "source": "Bartzokis et al., 2010, Neurobiol Aging, PMID: 18455269; Grydeland et al., 2013, J Neurosci, PMID: 24068821"}, {"id": "T04-C08", "claim": "健康老化个体在60岁后海马体体积出现生理性加速萎缩，主因齿状回颗粒细胞发生减少与树突萎缩。", "verdict": "VERIFIED", "source": "Raz et al., 2005, Cereb Cortex, PMID: 15345549; Fraser et al., 2015, Neuroimage, PMID: 25680519"}, {"id": "T04-C09", "claim": "轻度认知障碍（MCI）转化为临床阿尔茨海默病（AD）阶段，海马体积丢失率呈2至5倍病理性激增。", "verdict": "VERIFIED", "source": "Barnes et al., 2009, Neurobiol Aging, PMID: 18353503; Henneman et al., 2009, Brain, PMID: 19675323"}, {"id": "T04-C10", "claim": "初孕女性在妊娠期间经历广泛对称的灰质体积缩减，该重塑特异性集中于心智化网络，具有高度神经适应性意义。", "verdict": "VERIFIED", "source": "Hoekzema et al., 2017, Nat Neurosci, PMID: 27991897; Martínez-García et al., 2021, Sci Adv, PMID: 34936442"}, {"id": "T04-C11", "claim": "新生儿脑体积约为成年终体积的25%，出生后第一年体积翻倍，神经纤维与胶质细胞呈指数暴增。", "verdict": "VERIFIED", "source": "Pfefferbaum et al., 1994, Arch Neurol, PMID: 8067923; Knickmeyer et al., 2008, J Neurosci, PMID: 18971476"}, {"id": "T04-C12", "claim": "胼胝体与上纵束的各向异性分数（FA）达峰年龄晚于下层投射纤维，标志高级联合网络长程传导效率最后成熟。", "verdict": "VERIFIED", "source": "Lebel et al., 2012, Neuroimage, PMID: 22305988; Westlye et al., 2010, Cereb Cortex, PMID: 20080998"}, {"id": "T04-C13", "claim": "40岁以后全脑体积开始出现线性递减，伴随白质微结构FA下降与轴向扩散系数（MD）升高。", "verdict": "VERIFIED", "source": "Hedman et al., 2012, Hum Brain Mapp, PMID: 21391264; Fjell et al., 2009, J Neurosci, PMID: 19955386"}]}</script>
<script>
const D=JSON.parse(document.getElementById('dimension-data').textContent);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('stages').innerHTML=D.stages.map(s=>`<div class="stage"><div class="age">${esc(s.age)}</div>${s.title&&s.title!==s.age?`<h3>${esc(s.title)}</h3>`:''}<p>${esc(s.what)}</p>${s.normal?`<p class="normal">正常范围：${esc(s.normal)}</p>`:''}${s.warn?`<p class="warn">留意：${esc(s.warn)}</p>`:''}</div>`).join('');
document.getElementById('redflags').innerHTML=D.redflags.map(r=>`<tr><td>${esc(r.signal)}</td><td>${esc(r.action)}</td></tr>`).join('');
document.getElementById('levers').innerHTML=D.levers.map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(l.effect)}</td><td>${esc(l.note||'')}</td></tr>`).join('');
document.getElementById('insight').textContent=D.insight;
document.getElementById('claims').innerHTML=D.claims.map(c=>`<tr><td>${esc(c.id)}</td><td>${esc(c.claim)}</td><td>${esc(c.verdict)}</td><td>${esc(c.source)}</td></tr>`).join('');
// mechanism nodes
const nodes=D.mechanism.nodes||[];const W=820,H=120;
let svg=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
nodes.forEach((n,i)=>{const x=nodes.length>1?100+i*(W-200)/(nodes.length-1):W/2;
 if(i>0){const px=100+(i-1)*(W-200)/(nodes.length-1);svg+=`<line x1="${px+18}" y1="60" x2="${x-18}" y2="60" stroke="#b4552d" stroke-width="2"/>`;}
 svg+=`<g class="node" data-i="${i}"><circle cx="${x}" cy="60" r="18"/><text x="${x}" y="65" text-anchor="middle">${i+1}</text></g><text x="${x}" y="100" text-anchor="middle" font-size="12" fill="#2b2620">${esc(n.t)}</text>`;});
svg+='</svg>';
document.getElementById('mechsvg').innerHTML=svg;
const md=document.getElementById('mechdesc');
function show(i){md.innerHTML=`<b>${i+1}. ${esc(nodes[i].t)}</b>：${esc(nodes[i].d)}`;}
document.querySelectorAll('.node').forEach(g=>g.addEventListener('click',()=>show(+g.dataset.i)));
if(nodes.length)show(0);
document.getElementById('mechnote').textContent=D.mechanism.note||'';
// charts
function linePath(pts,x0,x1,y0,y1,vmin,vmax){return pts.map((p,i)=>{const x=x0+(x1-x0)*p[0]/100;const y=y1-(y1-y0)*(p[1]-vmin)/(vmax-vmin);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}).join(' ');}
function renderChart(ch){const W=820,H=300,x0=50,x1=790,y0=30,y1=260;
 let all=[];ch.series.forEach(s=>{(s.points||[]).forEach(p=>all.push(p[1]));(s.upper||[]).forEach(p=>all.push(p[1]));(s.lower||[]).forEach(p=>all.push(p[1]));});
 const vmin=Math.min(...all),vmax=Math.max(...all);const colors=['#b4552d','#3d6b8a','#7a9a3d','#8a5aa0'];
 let s=`<svg viewBox="0 0 ${W} ${H}">`;
 s+=`<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#7a7264"/><text x="${x0}" y="${y1+20}" font-size="12" fill="#7a7264">0岁</text><text x="${x1-30}" y="${y1+20}" font-size="12" fill="#7a7264">100岁</text>`;
 if(ch.type==='range_band'){ch.series.forEach((se,i)=>{const up=linePath(se.upper,x0,x1,y0,y1,vmin,vmax);const lo=linePath([...se.lower].reverse(),x0,x1,y0,y1,vmin,vmax);s+=`<path d="${up} ${lo.replace(/^M/,'L')} Z" fill="${colors[i%4]}" opacity="0.25"/><path d="${up}" fill="none" stroke="${colors[i%4]}" stroke-width="2"/>`;});}
 else if(ch.type==='stacked_area'){let base=ch.series[0].points.map(p=>[p[0],vmin]);ch.series.forEach((se,i)=>{const top=se.points.map((p,j)=>[p[0],base[j][1]+p[1]]);const tp=linePath(top,x0,x1,y0,y1,vmin,vmax);const bp=linePath([...base].reverse(),x0,x1,y0,y1,vmin,vmax);s+=`<path d="${tp} ${bp.replace(/^M/,'L')} Z" fill="${colors[i%4]}" opacity="0.5"/>`;base=top;});}
 else{ch.series.forEach((se,i)=>{s+=`<path d="${linePath(se.points,x0,x1,y0,y1,vmin,vmax)}" fill="none" stroke="${colors[i%4]}" stroke-width="2.5"/>`;});}
 ch.series.forEach((se,i)=>{s+=`<text x="${x0+i*160}" y="18" font-size="13" fill="${colors[i%4]}">${esc(se.name)}</text>`;});
 return s+'</svg>';}
if(D.chart){document.getElementById('chartwrap').innerHTML='<h2>一生曲线</h2>'+renderChart(D.chart);}
</script>
</body></html>
