<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>韧带肌腱与柔韧平衡</title><style>
:root{--bg:#f7f2e9;--ink:#2b2620;--mut:#7a7264;--acc:#b4552d;--card:#fffdf8;--line:#e3dac8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC",serif;line-height:1.75}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 60px}

<body><div class="wrap">

<script id="dimension-data" type="application/json">{"stages": [{"age": "2–8岁", "title": "儿童高柔韧期", "what": "关节活动度处于全生命周期最高阶段，女性在几乎所有关节柔韧性上表现均高于男性（如髋屈曲女140.8° vs 男131.1°）。", "normal": "髋屈曲女140.8°±5.1°、男131.1°±6.3°；髋后伸女26.2°±7.4°、男28.3°±4.0°", "warn": ""}, {"age": "9–19岁", "title": "青春期定型", "what": "关节活动度较儿童期略有收窄并逐渐定型，男女髋屈曲接近（女134.9° vs 男135.2°），女性髋后伸略高于男性（20.5° vs 18.2°）。", "normal": "髋屈曲女134.9°±7.4°、男135.2°±7.6°；髋后伸女20.5°±7.1°、男18.2°±5.6°", "warn": ""}, {"age": "20–44岁", "title": "青年功能平台", "what": "肌腱韧带力学性能与静态平衡维持在高位平台期，<45岁人群无法完成10秒单腿站立的比例极低（不足1%）；女性柔韧度持续略优于男性。", "normal": "10秒单腿站立失败率<1%；髋屈曲女133.8°±7.9°、男130.4°±7.5°；髋后伸女18.1°±6.6°、男17.4°±5.9°", "warn": ""}, {"age": "45–69岁", "title": "中老年收窄期", "what": "关节活动度全面收窄，男性髋后伸降至13.5°（直接导致步幅缩短与骨盆前倾代偿）；50岁后静态平衡能力出现断崖式下滑，单腿站立失败率每5岁近乎翻倍（51–55岁4.7%飙升至66–70岁36.8%）。", "normal": "髋屈曲女130.8°±8.8°、男127.2°±7.4°；髋后伸女16.7°±7.0°、男13.5°±5.2°", "warn": "50岁中后期单腿站立不稳；无法坚持完成10秒单腿站立"}, {"age": "71–75岁", "title": "高危失衡期", "what": "平衡退化过半数，超过53.6%的人无法完成10秒单腿站立（风险为51–55岁组的11倍以上），跌倒与全因死亡风险陡增。", "normal": "完成10秒单腿站立；TUG测试<12秒", "warn": "10秒单腿站立失败；起立-行走计时测试≥12秒；无法完成前后脚跟尖相接站立10秒"}], "redflags": [{"signal": "10秒单腿站立（10-s OLS）测试3次均无法坚持满10秒", "action": "评估全系统储备与跌倒风险（校正全因死亡风险升高84%），筛查糖尿病等合并症并启动多感官平衡与力量干预"}, {"signal": "起立-行走计时测试（TUG）耗时≥12秒", "action": "判定存在明确跌倒风险，进行CDC STEADI跌倒风险全面临床评估（包括30秒坐站与4阶段平衡测试）"}, {"signal": "4阶段平衡测试中无法完成前后脚跟尖相接（Tandem Stance）达10秒", "action": "提示高跌倒风险，应开展针对性防跌倒与本体感觉训练"}, {"signal": "闭眼单腿站立明显短于睁眼，或需扶墙才能站稳", "action": "本体感觉与平衡整合下降，每周 3 次平衡训练（单腿站立、脚跟-脚尖走）"}], "levers": [{"name": "缓慢大负荷抗阻与离心训练（Heavy Slow Resistance / Eccentric Loading）", "effect": "刺激肌腱细胞合成新胶原、改善胶原排列整齐度，每周2–3次，留足48小时修复窗口", "note": "单纯静态拉伸仅改变神经对拉伸痛感的耐受度，无法实现肌腱胶原重塑"}, {"name": "多感官平衡训练", "effect": "提升静态与动态平衡能力，唤醒足底本体感觉并改善踝关节背屈柔韧度", "note": "可在安全扶手旁练习单腿刷牙、闭眼前后脚站立，或进行太极、单腿硬拉等重心转移练习"}], "insight": "肌腱变硬变脆易断裂，50岁后平衡断崖每5岁翻倍，10秒单腿站立是测跌倒与长寿的硬标尺。", "mechanism": {"nodes": [{"t": "AGEs糖基化交联", "d": "晚期糖基化终末产物累积并上调转谷氨酰胺酶，锁定胶原原纤维微滑动，导致肌腱僵硬且脆化"}, {"t": "活动度非均匀递减", "d": "胶原含水量下降与弹性蛋白降解，使主动活动度下降大于被动活动度，髋后伸受限引发步幅缩短代偿"}, {"t": "平衡多系统退化", "d": "50岁后整合本体感觉、视觉与前庭的神经肌骨系统储备下滑，表现为单腿站立失败率阶梯飙升"}], "note": "肌腱韧带因糖基化与胶原退变陷入“既僵硬又脆化”的矛盾状态，并在50岁后随多感官整合衰退引发平衡断崖。"}, "claims": [{"id": "T08-C01", "claim": "无法完成10秒单腿站立者的全因死亡风险显著升高84%（校正HR=1.84，95% CI: 1.23–2.78，P<0.001）", "verdict": "VERIFIED", "source": "PMID: 35728834"}, {"id": "T08-C02", "claim": "无法完成10秒单腿站立的比例随年龄阶梯上升：51–55岁为4.7%，56–60岁为8.1%，61–65岁为17.8%，66–70岁为36.8%，71–75岁达53.6%", "verdict": "VERIFIED", "source": "PMID: 35728834"}, {"id": "T08-C03", "claim": "在10秒单腿站立队列中，未通过组的糖尿病患病率为37.9%，是通过组（12.6%）的3倍", "verdict": "VERIFIED", "source": "PMID: 35728834"}, {"id": "T08-C04", "claim": "CDC联合物理治疗师对674人系统测量显示所有关节平均活动度随年龄下降，且女性在几乎所有关节与年龄段均高于男性", "verdict": "VERIFIED", "source": "PMID: 21070485"}, {"id": "T08-C05", "claim": "AGEs诱导非酶促交联并在肌腱细胞中上调转谷氨酰胺酶活性，加剧胶原异常交联使肌腱僵硬易损", "verdict": "VERIFIED", "source": "PMC10607611"}, {"id": "T08-C06", "claim": "起立-行走计时测试（TUG）耗时≥12秒即判定存在明确跌倒风险（健康成人均值约8秒）", "verdict": "VERIFIED", "source": "CDC STEADI TUG PDF"}], "dim": "T08", "title": "韧带肌腱与柔韧平衡", "subtitle": "筋腱与平衡：跌倒风险的开关", "model_note": "内容稿件：用户提供的第 2 批 MD 稿件；数值经来源核查锁定；结构化：Vertex Gemini 3.8 Flash；本页由确定性模板渲染。"}</script>
<script>
const D=JSON.parse(document.getElementById('dimension-data').textContent);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('stages').innerHTML=D.stages.map(s=>`<div class="stage"><div class="age">${esc(s.age)}</div>${s.title&&s.title!==s.age?`<h3>${esc(s.title)}</h3>`:''}<p>${esc(s.what)}</p>${s.normal?`<p class="normal">正常范围：${esc(s.normal)}</p>`:''}${s.warn?`<p class="warn">留意：${esc(s.warn)}</p>`:''}</div>`).join('');
document.getElementById('redflags').innerHTML=D.redflags.map(r=>`<tr><td>${esc(r.signal)}</td><td>${esc(r.action)}</td></tr>`).join('');
document.getElementById('levers').innerHTML=D.levers.map(l=>`<tr><td>${esc(l.name)}</td><td>${esc(l.effect)}</td><td>${esc(l.note||'')}</td></tr>`).join('');
document.getElementById('insight').textContent=D.insight;
document.getElementById('claims').innerHTML=D.claims.map(c=>`<tr><td>${esc(c.id)}</td><td>${esc(c.claim)}</td><td>${esc(c.verdict)}</td><td>${esc(c.source)}</td></tr>`).join('');
// mechanism nodes
const nodes=D.mechanism.nodes||[];const W=820,H=120;
let svg=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
nodes.forEach((n,i)=>{const x=nodes.length>1?100+i*(W-200)/(nodes.length-1):W/2;
 if(i>0){const px=100+(i-1)*(W-200)/(nodes.length-1);svg+=`<line x1="${px+18}" y1="60" x2="${x-18}" y2="60" stroke="#b4552d" stroke-width="2"/>`;}
 svg+=`<g class="node" data-i="${i}"><circle cx="${x}" cy="60" r="18"/><text x="${x}" y="65" text-anchor="middle">${i+1}</text></g><text x="${x}" y="100" text-anchor="middle" font-size="12" fill="#2b2620">${esc(n.t)}</text>`;});
svg+='</svg>';
document.getElementById('mechsvg').innerHTML=svg;
const md=document.getElementById('mechdesc');
function show(i){md.innerHTML=`<b>${i+1}. ${esc(nodes[i].t)}</b>：${esc(nodes[i].d)}`;}
document.querySelectorAll('.node').forEach(g=>g.addEventListener('click',()=>show(+g.dataset.i)));
if(nodes.length)show(0);
document.getElementById('mechnote').textContent=D.mechanism.note||'';
// charts
function linePath(pts,x0,x1,y0,y1,vmin,vmax){return pts.map((p,i)=>{const x=x0+(x1-x0)*p[0]/100;const y=y1-(y1-y0)*(p[1]-vmin)/(vmax-vmin);return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}).join(' ');}
function renderChart(ch){const W=820,H=300,x0=50,x1=790,y0=30,y1=260;
 let all=[];ch.series.forEach(s=>{(s.points||[]).forEach(p=>all.push(p[1]));(s.upper||[]).forEach(p=>all.push(p[1]));(s.lower||[]).forEach(p=>all.push(p[1]));});
 const vmin=Math.min(...all),vmax=Math.max(...all);const colors=['#b4552d','#3d6b8a','#7a9a3d','#8a5aa0'];
 let s=`<svg viewBox="0 0 ${W} ${H}">`;
 s+=`<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#7a7264"/><text x="${x0}" y="${y1+20}" font-size="12" fill="#7a7264">0岁</text><text x="${x1-30}" y="${y1+20}" font-size="12" fill="#7a7264">100岁</text>`;
 if(ch.type==='range_band'){ch.series.forEach((se,i)=>{const up=linePath(se.upper,x0,x1,y0,y1,vmin,vmax);const lo=linePath([...se.lower].reverse(),x0,x1,y0,y1,vmin,vmax);s+=`<path d="${up} ${lo.replace(/^M/,'L')} Z" fill="${colors[i%4]}" opacity="0.25"/><path d="${up}" fill="none" stroke="${colors[i%4]}" stroke-width="2"/>`;});}
 else if(ch.type==='stacked_area'){let base=ch.series[0].points.map(p=>[p[0],vmin]);ch.series.forEach((se,i)=>{const top=se.points.map((p,j)=>[p[0],base[j][1]+p[1]]);const tp=linePath(top,x0,x1,y0,y1,vmin,vmax);const bp=linePath([...base].reverse(),x0,x1,y0,y1,vmin,vmax);s+=`<path d="${tp} ${bp.replace(/^M/,'L')} Z" fill="${colors[i%4]}" opacity="0.5"/>`;base=top;});}
 else{ch.series.forEach((se,i)=>{s+=`<path d="${linePath(se.points,x0,x1,y0,y1,vmin,vmax)}" fill="none" stroke="${colors[i%4]}" stroke-width="2.5"/>`;});}
 ch.series.forEach((se,i)=>{s+=`<text x="${x0+i*160}" y="18" font-size="13" fill="${colors[i%4]}">${esc(se.name)}</text>`;});
 return s+'</svg>';}
if(D.chart){document.getElementById('chartwrap').innerHTML='<h2>一生曲线</h2>'+renderChart(D.chart);}
</script>
</body></html>
