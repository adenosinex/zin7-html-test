<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>轻应用</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f7f7f7;
  --fg: #1a1a1a;
  --card: #ffffff;
  --border: #e3e3e3;
  --muted: #666666;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161616;
    --fg: #e8e8e8;
    --card: #222222;
    --border: #333333;
    --muted: #aaaaaa;
  }
}
body {
  margin: 0;
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--fg);
}
.wrap {
  max-width: 640px;
  margin: 0 auto;
  padding: 32px 20px;
}
h1 {
  font-size: 22px;
  margin: 0 0 6px;
}
.sub {
  color: var(--muted);
  margin: 0 0 24px;
  font-size: 14px;
}
.card {
  display: block;
  text-decoration: none;
  color: inherit;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 12px;
}
.name {
  display: block;
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 4px;
}
.note {
  display: block;
  font-size: 14px;
  color: var(--muted);
}
</style>
</head>
<body>
